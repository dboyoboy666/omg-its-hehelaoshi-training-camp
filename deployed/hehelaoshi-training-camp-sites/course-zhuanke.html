/* 智能识别姓名列：有“姓名/名字/name”表头按表头走；否则选中文最多、纯数字最少的列；过滤标题行与学号列 */
function pickNames(rows) {
  if (!rows.length) return [];
  const W = Math.max(...rows.map(r => r.length));
  const get = (r, c) => (rows[r][c] || '').trim();
  const isCjk = s => /[\u4e00-\u9fff]/.test(s);
  const isNum = s => /^\d+(\.\d+)?%?$/.test(s);
  const cjkCount = c => rows.reduce((n, _, r) => n + (isCjk(get(r, c)) ? 1 : 0), 0);
  const numCount = c => rows.reduce((n, _, r) => n + (get(r, c) && isNum(get(r, c)) ? 1 : 0), 0);
  let nameCol = -1, dataFrom = 0;
  const HEADER_RE = /^(姓名|名字|学生姓名|name)$/i;
  const SKIP_RE = /^(姓名|名字|学生姓名|name|学号|序号|编号|no\.?|id|#)$/i;
  for (let c = 0; c < W; c++) { if (HEADER_RE.test(get(0, c))) { nameCol = c; dataFrom = 1; break; } }
  if (nameCol < 0) {
    let best = -1;
    for (let c = 0; c < W; c++) {
      const score = cjkCount(c) * 10 - numCount(c);   /* 中文多、数字少者优先 */
      if (score > best) { best = score; nameCol = c; }
    }
    if (best <= 0) nameCol = 0;
  }
  const names = [];
  for (let r = dataFrom; r < rows.length; r++) {
    const v = get(r, nameCol);
    if (!v || SKIP_RE.test(v) || isNum(v)) continue;  /* 空格 / 标题 / 学号列残留 */
    names.push(v);
  }
  return names;
}

function pkAnswer(side, el, pick) {

    else if (x === el) x.classList.add('wrong');

/* =====================================================================
   L16 标定工具（教师诊断 / 自动化验收）
   —— 沿笔画【法线】偏移才有几何偏差；整字平移沿笔画方向不产生偏差，测不出真实容错
   ===================================================================== */
function smoothNoise(n) {
  let a = Array.from({ length: n }, () => Math.random() * 2 - 1);
  for (let pass = 0; pass < 3; pass++) {
    const b = a.slice();
    for (let i = 1; i < n - 1; i++) b[i] = (a[i - 1] + a[i] + a[i + 1]) / 3;
    a = b;
  }
  const mx = Math.max.apply(null, a.map(Math.abs)) || 1;

function offsetAlongNormal(ch, N, jitter) {
  const SM = 5;
  return autoSegs(ch).map(sg => {
    const n = sg.length, nz = jitter ? smoothNoise(n) : null;
    return sg.map((p, i) => {
      const a = sg[Math.max(0, i - SM)], c = sg[Math.min(n - 1, i + SM)];
      let tx = c[0] - a[0], ty = c[1] - a[1];
      const m = Math.hypot(tx, ty);
      if (m < 1e-6) return [p[0], p[1]];
      tx /= m; ty /= m;
      const d = N + (nz ? nz[i] * jitter : 0);
      return [p[0] - ty * d, p[1] + tx * d];

const LEVELS = [
  ['完美描摹（沿中心线）', ch => autoSegs(ch)],
  ['手抖峰值 ±4px', ch => offsetAlongNormal(ch, 0, 4)],
  ['手抖峰值 ±9px', ch => offsetAlongNormal(ch, 0, 9)],
  ['整体偏移 4px', ch => offsetAlongNormal(ch, 4, 0)],
  ['整体偏移 6px', ch => offsetAlongNormal(ch, 6, 0)],
  ['整体偏移 9px', ch => offsetAlongNormal(ch, 9, 0)],
  ['整体偏移 15px', ch => offsetAlongNormal(ch, 15, 0)],
  ['整体偏移 25px', ch => offsetAlongNormal(ch, 25, 0)],
  ['只描前一半笔画', ch => autoSegs(ch).slice(0, Math.max(1, Math.ceil(autoSegs(ch).length / 2)))],

/* =====================================================================
   描红判定自检闸门（v1.8 新增，何何老师要求「修完必须守住」）
   ---------------------------------------------------------------------
   守住两件**互相拉扯**的事，缺一不可：
     ① 沿灰字中心线描 → 必须满分。
        钉子案例：v1.8 之前判定侧漏加 PAD，屏幕上的笔迹与判定用的笔迹整体错开
        10px，「完全描在灰字上」只得 55 分 —— 学生练得再好也上不去，
        两人目测水平相近却因几像素之差被放大成几十分。这条断言永久钉死它。
     ② 涂满 / 乱画 不得拿高分。
        放宽容差是为了「不误伤认真描的学生」，绝不能顺手把防作弊门槛也放低。
     ③ 容差带内必须仍有区分度（v1.9 新增）。

const TRACE_SELF_KEYS = ['一', '大', '马', '水', '家', '日'];
function traceSelfCheck(key) {

  const chars = TRACE_SELF_KEYS.filter(c => GLYPHS4.seal[c] && CHARINFO[c]).slice(0, 4);
  if (!chars.length) { setDiff(bak); return ['自检样本字全部缺失，无法验证描红判定']; }
  chars.forEach(c => {
    const s = judgeScore(autoSegs(c), c, {}).score;

  });

     实际距离被吃掉一部分，gap 天生偏小，拿它当门槛会误报。
     门槛取 TL×0.35 —— 硬平台一旦回归，gap 会直接归零，必然触发。 */

  if (scrib) { const s = judgeScore(scrib(), chars[0], {}).score; if (s > 25) errs.push('乱画得 ' + s + ' 分（应 ≤25：防作弊门槛失效）'); }

  if (blank !== 0) errs.push('空笔迹得 ' + blank + ' 分（应 0）');

    trBox.render(); trLiveJudge();
    return S.tr.last;
  },
  autoInk: ch => {
    if (!trBox) return null;
    trBox.st.strokes = autoSegs(ch).map(s => s.map(p => [p[0], p[1]]));
    trBox.render(); trLiveJudge();
    return S.tr.last;
  },
  setBand: v => { invalidateBand(); return !!v; },
  ready: true
};

/* =====================================================================
   L17 初始化
   ===================================================================== */
function init() {
  const missing = CHARS.filter(c => !GLYPHS4.seal[c]);
  if (missing.length) console.warn('缺字形：', missing);
  buildDeck();
  loadDB();
  loadLib();        /* 把上次存下的字库档位灌回 LIB（必须在 loadDB 之后、go 之前） */
  syncLibUI();      /* 断言 + 刷新封面/字表上的所有字数文案 */
  const ra = document.getElementById('rosterArea');
  if (ra && DB.roster.length) ra.value = DB.roster.join('\n');
  boardDiff = S.diff;
  document.addEventListener('keydown', e => {
    const tg = e.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' && S.page < PAGE_N - 1) go(S.page + 1);
    if (e.key === 'ArrowLeft' && S.page > 0) go(S.page - 1);
    if (e.key === 'Escape') document.getElementById('detail').classList.remove('on');
  });
  window.addEventListener('resize', () => { if (fxOn) fxInit(); });
  go(PAGE_COVER);
  /* 描红判定自检放在首屏渲染之后跑（约 60ms），不阻塞第一帧 */
  setTimeout(guardTrace, 0);
}
document.addEventListener('DOMContentLoaded', init);

</script><div id="gkGate"><div id="gkBox"><div class="gkT">篆刻工坊 · 小篆训练营</div><div class="gkS">课堂教学专用 —— 请输入访问密钥</div><input id="gkIn" type="password" autocomplete="off" inputmode="text"><button id="gkGo">进 入</button><div id="gkErr"></div><button id="gkBack" type="button">‹ 返回导航页</button></div></div>
<script>
/* ===== 部署门禁逻辑：密钥只活内存（ok 变量），零持久化；关页/刷新即重输 ===== */
(function(){
  var KEY='zyywz', ok=false;
  function $(id){return document.getElementById(id)}
  window.__gkState=function(){return {on:!ok, bad:$('gkIn').classList.contains('bad')};};
  function tryIn(){
    var v=($('gkIn').value||'');
    if(v===KEY){ ok=true; $('gkGate').classList.add('off'); $('gkIn').value=''; $('gkErr').textContent=''; }
    else{ $('gkIn').classList.add('bad'); $('gkErr').textContent='密钥不对，请重试';
      setTimeout(function(){ $('gkIn').classList.remove('bad'); },450); }
  }
  function arm(){
    $('gkGo').onclick=tryIn;
    $('gkIn').addEventListener('keydown',function(e){ if(e.key==='Enter') tryIn(); });
    $('gkIn').focus();
    var back=$('gkBack');
    if(back) back.onclick=function(){ location.href='index.html'; };
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',arm); else arm();
})();
</script>

<style>
/* =====================================================================
   鼎铭小史官 · 大篆训练营 —— 青铜主题设计系统
   四色体系：青铜底 / 宣纸面板 / 朱砂 / 鎏金 + 铜绿点缀
   ===================================================================== */
:root{
  --bg1:#1c1710; --bg2:#2b2318;
  --paper:#f1e8d6; --paper2:#e6dac2; --paper3:#d9cbae;
  --ink:#241c14; --muted:#7d7062;
  --cin:#b03a2e; --cin-deep:#8e2b21;
  --gold:#c9a227; --gold-hi:#e8c96a;
  --patina:#3f7d5c; --patina-deep:#2e5f45;
  --ok:#1d9e75; --warn:#ef9f27;
  --r:16px; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--paper);
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(201,162,39,.10), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(63,125,92,.14), transparent 55%),
    linear-gradient(160deg, var(--bg2), var(--bg1));
  overflow:hidden;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;}

/* ---- 顶栏 ---- */
#top{position:fixed;top:0;left:0;right:0;height:56px;z-index:20;display:flex;align-items:center;
  padding:0 16px;gap:12px;background:linear-gradient(180deg,rgba(20,16,10,.92),rgba(20,16,10,.75));
  border-bottom:1px solid rgba(201,162,39,.25);backdrop-filter:blur(6px);}
#top .brand{font-weight:800;letter-spacing:1px;font-size:16px;
  background:linear-gradient(90deg,var(--gold-hi),var(--gold),var(--gold-hi));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;}
#top .brand small{font-size:11px;letter-spacing:2px;opacity:.8;}
#top .sp{flex:1;}
.tbtn{border:1px solid rgba(201,162,39,.4);background:rgba(241,232,214,.08);color:var(--paper);
  border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;transition:.15s;}
.tbtn:hover{background:rgba(241,232,214,.18);}
.tbtn:disabled{opacity:.4;cursor:not-allowed;}
#diffBadge{font-size:12px;color:var(--gold-hi);border:1px dashed rgba(201,162,39,.5);
  border-radius:999px;padding:4px 10px;white-space:nowrap;}

/* ---- deck 幻灯牌 ---- */
#deck{position:fixed;inset:56px 0 0 0;overflow:hidden;}
.slide{position:absolute;inset:0;padding:18px clamp(10px,3vw,36px) 26px;overflow-y:auto;overflow-x:hidden;
  display:none;animation:slideIn .38s cubic-bezier(.22,.9,.3,1);}
.slide.on{display:block;}
@keyframes slideIn{from{opacity:0;transform:translateY(16px) scale(.995)}to{opacity:1;transform:none}}
.wrap{max-width:1020px;margin:0 auto;}

/* ---- 通用组件 ---- */
.panel{background:var(--paper);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);
  padding:18px 20px;}
.panel.dark{background:linear-gradient(160deg,#241d12,#1b150d);color:var(--paper);
  border:1px solid rgba(201,162,39,.3);}
.h1{font-size:clamp(20px,3vw,26px);font-weight:800;margin:6px 0 4px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:none;border-radius:14px;padding:13px 22px;font-size:16px;font-weight:700;
  background:linear-gradient(180deg,#8e2b21,#6e1f17);color:#fff;letter-spacing:2px;
  box-shadow:0 6px 18px rgba(176,58,46,.35);transition:.15s;user-select:none;}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(176,58,46,.45);}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),#a8841c);color:#241c14;
  box-shadow:0 6px 18px rgba(201,162,39,.35);}
.btn.ghost{background:rgba(241,232,214,.1);color:var(--paper);border:1px solid rgba(241,232,214,.35);box-shadow:none;}
/* 浅色面板（panel/drawside）上的 ghost 按钮改墨色：米色字在米色底上不可读（真机截图抓到） */
.panel .btn.ghost,.drawside .btn.ghost{color:var(--ink);border-color:var(--paper3);background:rgba(36,28,20,.05);}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px;letter-spacing:1px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;
  border:1.5px solid var(--paper3);background:#fff8;color:var(--ink);cursor:pointer;font-size:14px;
  font-weight:600;transition:.15s;user-select:none;}
.chip.on{border-color:var(--cin);background:var(--cin);color:#fff;box-shadow:0 4px 12px rgba(176,58,46,.35);}
.bigchar{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:64px;line-height:1;color:var(--ink);}

/* ---- 封面 ---- */
#s0 .cover{max-width:1020px;margin:0 auto;text-align:center;padding-top:2vh;}
.orb{display:flex;justify-content:center;gap:clamp(4px,1.4vw,14px);margin:10px 0 2px;}
.orb span{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-weight:900;
  font-size:clamp(44px,8.5vw,84px);line-height:1.15;
  background:linear-gradient(115deg,var(--gold-hi) 10%,var(--gold) 35%,var(--patina) 55%,var(--gold-hi) 85%);
  background-size:220% 220%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:orbFloat 5.2s ease-in-out infinite, orbSheen 6.5s linear infinite;}
.orb span:nth-child(1){animation-delay:.0s,.0s}.orb span:nth-child(2){animation-delay:.7s,.9s}
.orb span:nth-child(3){animation-delay:1.4s,1.8s}.orb span:nth-child(4){animation-delay:2.1s,2.7s}
.orb span:nth-child(5){animation-delay:2.8s,3.6s}.orb span:nth-child(6){animation-delay:3.5s,4.5s}
.orb span:nth-child(7){animation-delay:4.2s,5.4s}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes orbSheen{0%{background-position:0% 40%}50%{background-position:100% 60%}100%{background-position:0% 40%}}
.tagline{color:#cbbd9d;font-size:clamp(13px,1.8vw,16px);letter-spacing:3px;margin:2px 0 4px;}
.tagline b{color:var(--gold-hi);}
.coverBtns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:16px 0 26px;}
.coverBtns .btn{min-width:190px;}
.setupCard{max-width:640px;margin:0 auto;}
.setupCard .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:10px;}
.setupCard .nameInput{width:180px;padding:7px 12px;border-radius:10px;border:2px solid rgba(201,162,39,.5);
  background:rgba(0,0,0,.25);color:var(--gold-hi);font-family:"STKaiti","Kaiti SC",KaiTi,serif;
  font-size:16px;font-weight:700;text-align:center;letter-spacing:1px;outline:none;}
.setupCard .nameInput:focus{border-color:var(--gold-hi);box-shadow:0 0 0 2px rgba(232,201,106,.25);}
.setupCard .nameInput::placeholder{color:#8d7f63;font-weight:400;}
.setupCard .lab{font-size:13px;color:var(--muted);width:100%;text-align:center;letter-spacing:2px;}
.footNote{color:#8d7f63;font-size:11px;margin-top:14px;letter-spacing:1px;}

/* ---- 字表 ---- */
.gridChars{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;}
.cell{background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 6px 6px;text-align:center;
  cursor:pointer;position:relative;transition:.15s;border:2px solid transparent;}
.cell:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.35);}
.cell svg{width:56px;height:56px;display:block;margin:0 auto;}
.cell .kai{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:17px;font-weight:700;margin-top:2px;}
.cell .lv{position:absolute;top:5px;left:7px;font-size:10px;color:var(--muted);}
.cell.rubbed{border-color:var(--patina);}
.cell.rubbed::after{content:"拓";position:absolute;right:5px;top:3px;font-size:10px;color:var(--patina);font-weight:700;}
.progLine{display:flex;align-items:center;gap:10px;margin:8px 2px 14px;font-size:13px;color:#cbbd9d;}
.progLine .bar{flex:1;height:10px;border-radius:999px;background:rgba(241,232,214,.14);overflow:hidden;}
.progLine .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--patina),var(--gold));width:0%;transition:width .6s;}

/* ---- 问答（识铭/辨铭/PK 题面共用） ---- */
.qsWrap{max-width:760px;margin:0 auto;}
.stemBox{display:flex;justify-content:center;margin:8px 0 16px;}
.stemBox .glyphCard{background:var(--paper);border-radius:20px;padding:14px;box-shadow:var(--shadow);
  border:3px solid var(--gold);}
.stemBox svg{width:clamp(150px,26vw,210px);height:clamp(150px,26vw,210px);display:block;}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.opts.c4{grid-template-columns:repeat(4,1fr);}
@media (max-width:720px){.opts.c4{grid-template-columns:repeat(2,1fr);}}
.opt{background:var(--paper);color:var(--ink);border-radius:16px;border:2.5px solid transparent;
  font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:clamp(30px,5vw,44px);font-weight:700;
  padding:16px 6px;text-align:center;cursor:pointer;transition:.15s;user-select:none;}
.opt:hover{transform:translateY(-3px);border-color:var(--gold);}
.opt.right{border-color:var(--ok);background:#e9f7f1;animation:popOk .4s;}
.opt.wrong{border-color:var(--cin);background:#f9e9e7;animation:shake .35s;}
.opt:disabled{cursor:default;transform:none;}
@keyframes popOk{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qTop{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto 6px;}
.qTop .prog{flex:1;height:9px;border-radius:999px;background:rgba(241,232,214,.14);overflow:hidden;}
.qTop .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cin));width:0%;transition:width .4s;}
.qTop .marks{font-size:14px;color:var(--gold-hi);white-space:nowrap;font-weight:700;}
.qTop .timer{font-size:14px;font-weight:800;min-width:52px;text-align:center;color:var(--paper);}
.qTop .timer.urgent{color:#ff6b5e;animation:pulse .5s infinite;}
@keyframes pulse{50%{opacity:.45}}
.qFeed{text-align:center;min-height:30px;margin-top:12px;font-size:15px;font-weight:700;}
.qFeed.good{color:var(--ok);} .qFeed.bad{color:#ff8f83;}

/* ---- 写铭（描红） ---- */
.trWrap{display:grid;grid-template-columns:minmax(280px,420px) minmax(260px,1fr);gap:18px;
  max-width:920px;margin:0 auto;align-items:start;}
@media (max-width:760px){.trWrap{grid-template-columns:1fr;}}
.cvbox{position:relative;width:100%;touch-action:none;}
.cvbox canvas{position:absolute;inset:0;width:100%;height:100%;}
.cvbox canvas:first-child{position:relative;}
.trPanel .charMeta{display:flex;align-items:baseline;gap:12px;}
.trPanel .charMeta .big{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:40px;font-weight:800;}
.trPanel .charMeta .py{color:var(--muted);font-size:14px;}
.verdict{font-size:15px;font-weight:800;margin:10px 0 4px;}
.scoreRow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
.scoreTag{border-radius:10px;padding:6px 10px;font-size:12px;background:var(--paper2);color:var(--ink);font-weight:700;}
.scoreTag b{font-size:15px;}
.strokeChips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;}
.sChip{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;background:var(--paper2);color:var(--muted);}
.sChip.ok{background:#d9efe6;color:var(--ok);}
.sChip.bad{background:#f6d9d5;color:var(--cin-deep);}
.sChip.unfinished{background:#2c2c2c;color:#ff8f83;}
.trBtns{display:flex;gap:10px;flex-wrap:wrap;}
.bandNote{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;}

/* ---- 铸鼎 ---- */
.castWrap{max-width:860px;margin:0 auto;text-align:center;}
.dingBox{position:relative;display:inline-block;margin:6px 0 4px;}
.dingBox svg{width:min(78vw,520px);height:auto;display:block;}
#dingSlots{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);
  display:grid;grid-template-columns:repeat(7,1fr);gap:2px;width:56%;}
.slotChar{font-family:"STKaiti","Kaiti SC",KaiTi,serif;color:#ffe9ad;opacity:0;
  font-size:clamp(13px,2.8vw,22px);text-align:center;transform:scale(2.2) translateY(-14px);
  transition:all .5s cubic-bezier(.2,.8,.3,1.2);
  text-shadow:0 0 6px rgba(255,214,90,1),0 1px 2px rgba(40,28,8,.9);font-weight:700;}
.slotChar.in{opacity:.96;transform:none;}
/* 落字（何何老师 2026-10-06 定稿）：不再是金色小球点缀，字带金边亲自落鼎——
   charDrop .55s 加速下落（-84px→0），落程中金边渐亮（brightness 1→1.6）、渐宽（描边 .5→2px）、
   外围边缘渐柔渐模糊（text-shadow 光晕半径随之下增长，字身保持清晰）；
   落定那一刻 charFlash 接棒 1s：整字连金边一起脉冲闪烁（每字独立计时，前后字并行互不影响），
   播完自动回归常态。两段 0%/100% 关键帧首尾相接（落定态/常态），接缝无跳变 */
.slotChar.in.flash{animation:charDrop .55s cubic-bezier(.55,.06,.68,.19), charFlash 1s ease-in-out .55s;}
/* 落点向量由 JS 逐字写入 CSS 变量（--dx/--dy：四向随机 + 距离 60~130px + 垂直抖动），关键帧只认变量 */
@keyframes charDrop{
  0%{opacity:0;transform:translate(var(--dx,0px),var(--dy,-84px)) scale(1.35);
    -webkit-text-stroke:.5px rgba(255,215,106,.35);
    text-shadow:0 0 4px rgba(255,214,90,.45),0 1px 2px rgba(40,28,8,.9);
    filter:brightness(1);}
  55%{opacity:.96;
    -webkit-text-stroke:1.2px rgba(255,215,106,.8);
    text-shadow:0 0 9px rgba(255,214,90,.8),0 0 20px rgba(255,183,74,.4),0 1px 2px rgba(40,28,8,.9);
    filter:brightness(1.35);}
  100%{opacity:.96;transform:none;
    -webkit-text-stroke:2px #ffd76a;
    text-shadow:0 0 14px rgba(255,214,90,.95),0 0 30px rgba(255,184,74,.6),0 1px 2px rgba(40,28,8,.9);
    filter:brightness(1.6);}
}
/* 落定闪烁（1s）：0% 接住 charDrop 落定态（无跳变）→ 3 个强光峰（金边同加宽至 2.5px）→ 100% 回归 .in 常态 */
@keyframes charFlash{
  0%{-webkit-text-stroke:2px #ffd76a;
    text-shadow:0 0 14px rgba(255,214,90,.95),0 0 30px rgba(255,184,74,.6),0 1px 2px rgba(40,28,8,.9);
    filter:brightness(1.6);}
  15%,45%,80%{-webkit-text-stroke:2.5px #ffe9ad;
    text-shadow:0 0 20px #fff3cd,0 0 38px #ffd76a,0 0 60px #ffb84a;filter:brightness(2.6);}
  30%,62%{-webkit-text-stroke:1.6px rgba(255,215,106,.85);
    text-shadow:0 0 9px rgba(255,214,90,1);filter:brightness(1.25);}
  100%{-webkit-text-stroke:0px rgba(255,215,106,0);
    text-shadow:0 0 6px rgba(255,214,90,1),0 1px 2px rgba(40,28,8,.9);filter:brightness(1);}
}
/* 全部铸完：整鼎（鼎身+字）整体高亮脉冲闪烁 2 秒 */
.dingBox.dingFlash{animation:dingFlash 2s ease-in-out;}
@keyframes dingFlash{
  0%,100%{filter:brightness(1);}
  15%,45%,80%{filter:brightness(2.2) drop-shadow(0 0 36px rgba(232,201,106,.9)) drop-shadow(0 0 90px rgba(255,214,90,.5));}
  30%,62%{filter:brightness(1.3) drop-shadow(0 0 14px rgba(232,201,106,.45));}
}
.castCaption{font-size:15px;color:#cbbd9d;min-height:26px;}
.castCaption b{color:var(--gold-hi);}

/* ---- 结算 ---- */
.resWrap{max-width:640px;margin:0 auto;text-align:center;}
.resScore{font-size:clamp(46px,9vw,72px);font-weight:900;line-height:1;
  background:linear-gradient(115deg,var(--gold-hi),var(--gold),var(--gold-hi));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.resTitle{font-size:clamp(19px,3vw,24px);font-weight:800;color:var(--gold-hi);margin:10px 0 6px;}
.resWord{font-size:14px;color:#cbbd9d;line-height:1.8;margin-bottom:16px;}
.resStats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0 20px;}
.resStat{background:rgba(241,232,214,.08);border:1px solid rgba(201,162,39,.3);border-radius:14px;
  padding:10px 18px;min-width:104px;}
.resStat .v{font-size:22px;font-weight:800;color:var(--gold-hi);}
.resStat .k{font-size:11px;color:#9d9078;letter-spacing:1px;}
.resBtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* ---- 双人（V3 继承 v6.6.618 特效体系） ---- */
.duoForm{max-width:640px;margin:0 auto;text-align:center;}
.duoForm input{width:min(100%,240px);border:2px solid var(--paper3);border-radius:12px;padding:12px 14px;
  font-size:16px;text-align:center;background:var(--paper);color:var(--ink);font-weight:700;outline:none;}
.duoForm input:focus{border-color:var(--gold);}
.vsRow{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0;}
.rosterArea{width:100%;height:88px;margin-top:8px;border:1px solid var(--paper3);border-radius:10px;
  padding:9px;font-family:inherit;font-size:14px;background:rgba(241,232,214,.9);color:var(--ink);resize:vertical;}
.duoCfgLine{font-size:13px;color:#cbbd9d;margin:8px 0 4px;line-height:1.7;}
.duoCfgLine b{color:var(--gold-hi);}
/* 双人 PK 整页禁用浏览器手势（捏合缩放/滚动）——根因：双人触屏书写时任一手指
   瞬间接触画布外区域（起笔悬停/两画布间中缝/卡片边缘），浏览器即激活双指手势，
   手势状态机在所有手指抬离前会吞掉一切新触点（pointercancel），表现为
   "某一方怎么画都没反应"。画布级 touch-action:none 挡不住页级手势，必须整页禁用。
   教室 16:9 投屏 PK 页一屏内展示无滚动需求，代价为零 */
#s8{touch-action:none;}
.pkWrap{max-width:1240px;margin:0 auto;}
.pkwrap{display:grid;grid-template-columns:1fr 26px 1fr;gap:0;align-items:stretch;}
.pkcol{padding:10px 14px;border-radius:14px;border:1px solid rgba(201,162,39,.3);
  background:linear-gradient(172deg,var(--paper),var(--paper2));color:var(--ink);}
.pkcol.act{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.22),var(--shadow);}
.pkcol h3{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:21px;margin:0 0 2px;letter-spacing:.07em;}
.pkcol .pks{font-size:12.5px;color:var(--muted);}
.pkcol .pkv{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:38px;font-weight:700;line-height:1.15;
  font-variant-numeric:tabular-nums;transition:transform .18s;}
.pkcol.L .pkv{background:linear-gradient(180deg,#b03a30,#7c150e);-webkit-background-clip:text;background-clip:text;color:transparent;}
.pkcol.R .pkv{background:linear-gradient(180deg,#2e7a6a,#17453b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.pkv.bump{transform:scale(1.22);}
.hpwrap{position:relative;margin-top:10px;}
.hp{height:22px;border-radius:11px;background:rgba(241,232,214,.14);border:1px solid rgba(201,162,39,.3);overflow:hidden;position:relative;}
.hp i{position:absolute;top:0;bottom:0;left:0;width:50%;background:linear-gradient(90deg,#c0392b,#e07b52);transition:width .5s;}
.hp i.r{left:auto;right:0;background:linear-gradient(270deg,#b8860b,#e0c060);}
.hp i.dominant{animation:hpFlash .38s ease-in-out infinite;z-index:2;}
.hp i.weak{animation:hpBreath 1.05s ease-in-out infinite;}
@keyframes hpFlash{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.9) saturate(1.55)}}

/* 金色闪电分隔（逐字复刻 v6.6.618 可复用资产）：一笔连贯闪电轮廓（不自交，防上下断裂）
   + boltFlick 快闪；8 颗粒子实心亮黄 + 辉光，负延迟错峰持续连发 */
.boltwrap{position:absolute;top:-10px;bottom:-10px;width:36px;transform:translateX(-50%);
  pointer-events:none;z-index:6;}
.boltwrap .bolt{position:absolute;left:50%;top:0;bottom:0;width:20px;transform:translateX(-50%);
  background:linear-gradient(180deg,#fffde7,#ffd700 45%,#ff8f00);
  clip-path:polygon(58% 0,20% 44%,46% 44%,30% 100%,82% 40%,54% 40%);
  animation:boltFlick .16s ease-in-out infinite alternate;}
@keyframes boltFlick{0%{opacity:.7;filter:drop-shadow(0 0 4px #ffd700)}
  100%{opacity:1;filter:drop-shadow(0 0 16px #fff59d) brightness(1.6)}}
.boltwrap .spark{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
  border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 3px rgba(255,215,0,.85);opacity:0;}
.boltwrap .s1{width:8px;height:8px;animation:spk1 .42s linear infinite;animation-delay:-.05s}
.boltwrap .s2{animation:spk2 .5s linear infinite;animation-delay:-.2s}
.boltwrap .s3{width:5px;height:5px;animation:spk3 .36s linear infinite;animation-delay:-.12s}
.boltwrap .s4{animation:spk4 .48s linear infinite;animation-delay:-.33s}
.boltwrap .s5{width:6px;height:6px;animation:spk5 .4s linear infinite;animation-delay:-.26s}
.boltwrap .s6{animation:spk6 .55s linear infinite;animation-delay:-.4s}
.boltwrap .s7{width:5px;height:5px;animation:spk7 .38s linear infinite;animation-delay:-.18s}
.boltwrap .s8{animation:spk8 .46s linear infinite;animation-delay:-.3s}
@keyframes spk1{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-30px,-36px) scale(.15);opacity:0}}
@keyframes spk2{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(30px,-38px) scale(.15);opacity:0}}
@keyframes spk3{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-34px,32px) scale(.2);opacity:0}}
@keyframes spk4{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(34px,34px) scale(.15);opacity:0}}
@keyframes spk5{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-42px,0) scale(.2);opacity:0}}
@keyframes spk6{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(42px,0) scale(.15);opacity:0}}
@keyframes spk7{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-14px,-46px) scale(.2);opacity:0}}
@keyframes spk8{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(14px,46px) scale(.15);opacity:0}}

@keyframes platePop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slamInR{0%{right:-360px;opacity:0;transform:translateY(-50%) scale(.8) rotate(8deg)}
  50%{right:30%;opacity:1;transform:translateY(-50%) scale(1.04) rotate(-3deg)}
  100%{right:auto;left:0;top:auto;opacity:1;transform:translate(0,0) scale(1) rotate(0)}}
@keyframes plateZoom{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.7) rotate(-3deg)}100%{transform:scale(1.32) rotate(-4deg)}}
@keyframes knockedFast{0%{transform:translateX(0) scale(1.32) rotate(-4deg);opacity:1}
  18%{transform:translateX(-40px) scale(1.18) rotate(-160deg);opacity:1}
  100%{transform:translateX(-220vw) scale(.35) rotate(-960deg);opacity:0}}
@keyframes heroGlow{0%{box-shadow:0 0 28px rgba(232,201,106,.7),0 0 60px rgba(201,162,39,.3)}
  100%{box-shadow:0 0 36px rgba(255,233,173,.95),0 0 80px rgba(201,162,39,.45)}}
.dizzy-stars{position:absolute;left:50%;top:-30px;width:0;height:0;z-index:6;pointer-events:none;
  animation:dizzyIn .25s ease-out forwards;}
@keyframes dizzyIn{0%{transform:translate(-50%,6px) scale(.4);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.dizzy-stars span{position:absolute;font-size:26px;color:#e8cd78;line-height:1;
  text-shadow:0 0 10px #c9962a,0 0 22px #fff3cd,0 2px 3px rgba(0,0,0,.28);
  animation:dizzySpin 1.8s linear infinite,dizzyBob .55s ease-in-out infinite alternate;}
@keyframes dizzySpin{0%{transform:rotate(var(--a,0deg)) translateY(-58px) rotate(0)}
  100%{transform:rotate(calc(var(--a,0deg) + 360deg)) translateY(-58px) rotate(-360deg)}}
@keyframes dizzyBob{0%{font-size:26px}100%{font-size:32px}}
.animEmpty{text-align:center;color:#9d9078;padding:40px 0;}

/* ---- 封面播送带（tagline 与按钮行之间的空隙带：环绕接力式循环） ---- */
/* 滚动范围收窄（何何老师 2026-10-06 定稿）：不再横贯全屏，带子 = 功能卡行
   （「开始铸铭」左缘 ↔「拓片墙·榜单」右缘）的精确宽度——
   .coverActions 宽 fit-content 由 .coverBtns 内容撑出，播送带 width:100% 随容器，
   文字只在卡行范围内出画/绕入（壳 overflow:hidden 裁切，slide 另加 overflow-x:hidden 兜底） */
/* 亮度/粗细与 tagline 的「大篆」一致（何何老师 2026-10 定稿）：纯亮金 --gold-hi + 粗体 700，
   不再叠 0.7 透明度与多色渐变（渐变里的铜绿/朱砂暗段会拉暗文字） */
.coverActions{width:fit-content;max-width:100%;margin:0 auto;}
.coverOrbit{position:relative;width:100%;height:28px;
  overflow:hidden;margin-top:0;pointer-events:none;}
.orbitRun{position:absolute;left:0;top:0;width:200%;display:inline-flex;white-space:nowrap;will-change:transform;
  font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-weight:700;font-size:15px;letter-spacing:4px;
  color:var(--gold-hi);
  animation:orbitSweep 29s linear infinite;}
/* 每副本占整整一带宽（文字 + 右侧空白）⇒ 副本间隔一带：
   右端消失多少（S 端出画），左端同步出现多少（上一副本同段绕入），
   带内可见量恒 = 一份完整文案（主体+绕回尾巴相加），结构上不可能同屏两份。
   orbitRun 宽必须显式 200%（i 的百分比才能对着定宽解析），i=50% 即一带宽 */
.orbitRun i{display:inline-block;flex:none;width:50%;font-style:normal;}
/* -50%→0 = 每周期平移一带宽，内容恒向右流；
   时长 = 实测带宽 ÷ 28.4px/s（速度口径延续原 1280 宽/45s，感知速度不变）：
   本轮实测带宽 828.5px（1280/1445 视口一致）→ 29.1s ≈ 29s（28.6px/s，偏差 0.5%）。
   若改按钮文案/字号致带宽变化，按此式重算这一个值 */
@keyframes orbitSweep{from{transform:translateX(-50%)}to{transform:translateX(0)}}

/* ---- 拓片墙 / 榜单 ---- */
.tabRow{display:flex;gap:10px;justify-content:center;margin-bottom:14px;}
/* 难度子榜切换行（2026-10-08 分档定稿：菜鸟/困难/梦魇独立榜单页内切换） */
.diffTabs{display:flex;gap:8px;justify-content:center;margin:4px 0 6px;flex-wrap:wrap;}
.rubGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
.rubCard{border-radius:14px;padding:10px;text-align:center;background:linear-gradient(165deg,#3a332a,#241f18);
  border:1px solid rgba(201,162,39,.35);color:var(--paper);}
.rubCard .glyph svg{width:64px;height:64px;display:block;margin:0 auto;}
.rubCard .glyph svg path{fill:#c0392b !important;}
.rubCard .kai{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:15px;color:var(--gold-hi);margin-top:4px;}
.rubCard.empty{opacity:.32;}
/* 本关完成后首次打开拓片墙：已拓卡逐行巡游——金框高亮闪烁 1 秒/张 */
/* 快闪脉冲（何何老师 2026-10-06 定稿：要金色闪烁，不要白光）——
   峰值亮度压到 1.12+饱和提升（红字保持红），边框/光晕用饱和金，杜绝发白 */
.rubCard.tour{animation:rubTour 1s ease-in-out;}
@keyframes rubTour{
  0%,100%{border-color:rgba(201,162,39,.35);box-shadow:none;filter:brightness(1);}
  50%{border-color:#f0b93c;box-shadow:0 0 0 3px rgba(216,164,42,.55),0 0 30px rgba(216,164,42,.75);filter:brightness(1.12) saturate(1.25);}
}
/* 巡游收束（增量㉘）：最后一张闪完，整页+所有金边框同闪一次高强度动态金光 1s（效仿铸鼎 dingFlash 双阴影脉冲） */
#s9.wallFinale{animation:wallFinale 1s ease-in-out;}
#s9.wallFinale .rubCard:not(.empty){animation:wallFinaleCard 1s ease-in-out;}
@keyframes wallFinale{
  0%,100%{filter:brightness(1);}
  25%,65%{filter:brightness(2) drop-shadow(0 0 30px rgba(232,201,106,.85)) drop-shadow(0 0 80px rgba(255,214,90,.45));}
  45%{filter:brightness(1.25) drop-shadow(0 0 12px rgba(232,201,106,.4));}
}
@keyframes wallFinaleCard{
  0%,100%{border-color:rgba(201,162,39,.35);box-shadow:none;}
  25%,65%{border-color:#ffd76a;box-shadow:0 0 0 3px rgba(232,201,106,.6),0 0 34px rgba(232,201,106,.8);}
  45%{border-color:rgba(201,162,39,.5);box-shadow:none;}
}
.rubCard .sw{font-size:10.5px;color:#9d9078;margin-top:2px;min-height:26px;}
table.rk{width:100%;border-collapse:collapse;background:var(--paper);color:var(--ink);
  border-radius:14px;overflow:hidden;}
table.rk th,table.rk td{padding:9px 10px;font-size:13px;border-bottom:1px solid var(--paper3);text-align:center;}

/* 结算页内嵌榜单（2026-10-06：通关即见榜，免切拓片墙；紧凑字号保首屏免滚动） */

.taoItem .taoIco{font-size:30px;flex:none;}
.taoItem .taoBody{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;}
.taoName{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:20px;font-weight:800;color:var(--ink);}
.taoSkill{font-style:normal;font-size:11px;color:var(--patina-deep);border:1px solid var(--patina);
  border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px;}
.taoDesc{font-size:13px;color:var(--muted);line-height:1.6;}
.taoBtns{display:flex;gap:12px;justify-content:center;margin-top:14px;}
/* 点兵点将 */
.dianRules{max-width:640px;margin:0 auto 16px;text-align:left;font-size:14px;line-height:1.9;color:var(--ink);}
.dianRules b{color:var(--cin-deep);}
.tierDesc{width:100%;font-size:13px;color:var(--patina-deep);font-weight:700;margin-top:6px;}
.dianBar{width:min(100%,240px);margin:2px auto 0;}
.dianBarNum{font-size:14px;font-weight:800;color:var(--gold-hi);min-height:18px;font-variant-numeric:tabular-nums;text-align:center;}
.dianVsRow{margin-top:10px;flex-wrap:wrap;}
.dianStage{max-width:980px;margin:0 auto;}
.dianBanner{font-size:14px;font-weight:800;color:var(--gold-hi);letter-spacing:1px;text-align:center;margin-bottom:8px;}
.dianMain{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;flex:1 1 auto;}
.dianHalfName{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:18px;font-weight:800;color:var(--gold-hi);letter-spacing:2px;line-height:1.2;}
.dianScoreTag{font-size:12.5px;color:#cbbd9d;}
.dianScoreTag b{color:var(--gold-hi);font-size:16px;}
.dianGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.dcell{position:relative;width:clamp(76px,10.5vw,118px);height:clamp(76px,10.5vw,118px);border-radius:16px;
  border:2.5px dashed rgba(201,162,39,.45);background:rgba(241,232,214,.07);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;user-select:none;}
.dcell svg{width:78%;height:78%;display:block;pointer-events:none;}
.dcell svg path{fill:#f1e8d6 !important;}   /* 深底上反白显示（拓片感，沿用 rubCard 的 fill 覆盖法） */
.dcell.lit{border-style:solid;border-color:var(--gold);background:rgba(241,232,214,.12);animation:dPop .4s;}
.dcell.gone{border-style:solid;border-color:rgba(201,162,39,.2);transition:.4s;}
.dcell.stamped{border-style:solid;border-color:var(--gold-hi);}
.dcell.right{border-color:var(--ok);background:rgba(29,158,117,.16);}
.dcell.wrong{border-color:var(--cin);background:rgba(176,58,46,.16);}
.dcell.dim{opacity:.55;}
@keyframes dPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.dstamp{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;
  background:var(--cin);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.4);animation:dPop .25s;z-index:2;}
.dSide{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:118px;flex:none;}
.dianOk{min-width:96px;}
.dianCount{font-size:13px;color:#cbbd9d;letter-spacing:1px;}
.dianCount b{color:var(--gold-hi);font-size:16px;}
.dianFeed{font-size:14px;font-weight:800;min-height:22px;text-align:center;}
.dianFeed.good{color:var(--ok);} .dianFeed.bad{color:#ff8f83;} .dianFeed.mid{color:var(--gold-hi);}
.dianMemHint{font-size:13px;color:#cbbd9d;text-align:center;min-height:20px;letter-spacing:1px;}
.dianMemHint b{color:var(--gold-hi);}
/* 双人分屏：确认键分立中缝两侧、垂直居中（何何老师 2026-10-07 定稿位置：答题区相邻处，
   不在屏幕底部）—— R 半屏确认键在答题区左缘，两键环抱中缝，像两位将军各自举令旗 */
.dianPk{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;margin-top:6px;}
.dianDivider{align-self:stretch;background:linear-gradient(180deg,transparent,rgba(201,162,39,.5),transparent);
  border-left:1px dashed rgba(201,162,39,.4);border-right:1px dashed rgba(201,162,39,.4);}
.dianHalf{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0;position:relative;}
/* V3.2 倒计时特效层：消失瞬间在各自半屏内居中（分屏互不遮掩），火焰大字依次更替 */
.dianCdn{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.dianCdnNum{position:absolute;font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-weight:900;
  font-size:clamp(80px,13vw,170px);letter-spacing:6px;white-space:nowrap;
  background:linear-gradient(180deg,#fff3cd 8%,#ffd76a 32%,#ff9f2e 58%,#e0512e 86%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:dCdn .92s cubic-bezier(.2,.8,.3,1) forwards;}
/* 火焰燃烧感：0% 瞬间放大 3 倍（强光）→ 18% 定格 3 倍 → 55% 缩回原大（辉光燃烧起伏）→ 淡出消失 */
@keyframes dCdn{
  0%{transform:scale(3);opacity:0;
    filter:drop-shadow(0 0 26px rgba(255,150,40,.95)) drop-shadow(0 0 60px rgba(255,80,20,.6)) brightness(2.1);}
  18%{transform:scale(3);opacity:1;
    filter:drop-shadow(0 0 24px rgba(255,150,40,.95)) drop-shadow(0 0 56px rgba(255,80,20,.55)) brightness(1.9);}
  55%{transform:scale(1);opacity:1;
    filter:drop-shadow(0 0 18px rgba(255,140,40,.85)) drop-shadow(0 0 46px rgba(255,80,20,.5)) brightness(1.5);}
  72%{filter:drop-shadow(0 0 24px rgba(255,160,50,.95)) drop-shadow(0 0 58px rgba(255,90,25,.6)) brightness(1.8);}
  100%{transform:scale(.88);opacity:0;
    filter:drop-shadow(0 0 12px rgba(255,120,30,.6)) drop-shadow(0 0 30px rgba(255,70,15,.35)) brightness(1.1);}
}
/* New Winner（V3.2）：结算页一次性播报 —— 同款火焰大字（节奏放慢撑满 3 秒）+ 全屏玫瑰花瓣 */
#nwFx{position:fixed;inset:0;z-index:44;display:flex;align-items:center;justify-content:center;pointer-events:none;}
#nwFx .nwText{position:absolute;font-size:clamp(56px,9vw,120px);letter-spacing:4px;
  animation:nwText 2.6s cubic-bezier(.2,.8,.3,1) forwards;}
@keyframes nwText{
  0%{transform:scale(3);opacity:0;filter:drop-shadow(0 0 30px rgba(255,150,40,.95)) brightness(2.1);}
  14%{transform:scale(3);opacity:1;filter:drop-shadow(0 0 26px rgba(255,150,40,.95)) brightness(1.9);}
  38%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 18px rgba(255,140,40,.85)) brightness(1.5);}
  55%{filter:drop-shadow(0 0 26px rgba(255,160,50,.95)) brightness(1.8);}
  82%{transform:scale(1.02);opacity:1;}
  100%{transform:scale(.94);opacity:0;filter:drop-shadow(0 0 12px rgba(255,120,30,.5)) brightness(1.1);}
}
.nwPetals{position:absolute;inset:0;overflow:hidden;}
.nwPetals i{position:absolute;top:-26px;width:15px;height:13px;
  background:radial-gradient(circle at 32% 30%,#ffb3c1,#e05a6d 58%,#b03a4a);
  border-radius:62% 38% 56% 44%/56% 62% 38% 44%;
  box-shadow:0 1px 4px rgba(176,58,74,.4);
  animation:nwFall linear forwards;}
@keyframes nwFall{0%{margin-top:0;opacity:0}12%{opacity:1}100%{margin-top:108vh;opacity:.55;transform:rotate(300deg)}}
@media (max-width:900px){.dianPk{grid-template-columns:1fr;}.dianDivider{display:none;}
  .dianHalf.R{margin-top:14px;}}

#gkBox .gkT{font-family:'STKaiti','Kaiti SC',KaiTi,serif;font-size:clamp(14px,4.4vw,22px);letter-spacing:.08em;white-space:nowrap;color:var(--gold-hi,#e8c96a);margin-bottom:6px}

#gkIn.bad{border-color:#c0392b;animation:gkShake .38s}
@keyframes gkShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#gkGo{margin-top:14px;width:100%;padding:11px 0;font-size:15px;letter-spacing:.3em;font-weight:800;color:#14100b;background:linear-gradient(180deg,#e8c96a,#c9a227);border:none;border-radius:8px;cursor:pointer}
#gkErr{height:18px;margin-top:10px;font-size:12px;color:#e07b52}
#gkBack{margin-top:12px;background:none;border:1px solid rgba(201,162,39,.45);color:var(--muted,#9a8c72);font-size:12px;letter-spacing:.22em;padding:6px 16px;border-radius:999px;cursor:pointer;transition:color .25s,border-color .25s}
#gkBack:hover{color:var(--gold-hi,#e8c96a);border-color:var(--gold-hi,#e8c96a)}

function pickTraceSet(diff, dry) {
  const d = DIFF[diff];
  const out = [];
  [1, 2, 3].forEach(lv => {
    let pool = TRACE_POOL.filter(c => DZINFO[c].lv === lv);
    if (pool.length < (d.pick[lv] || 0)) pool = pool.concat(CHARS.filter(c => DZINFO[c].lv === lv && !pool.includes(c)));
    out.push(...shuffle(pool).slice(0, d.pick[lv] || 0));
  });
  if (out.length < d.count) { /* 兜底：分层不足时从全体 TRACE_POOL 补齐 */
    out.push(...shuffle(TRACE_POOL.filter(c => !out.includes(c))).slice(0, d.count - out.length));
  }
  const list = shuffle(out).slice(0, d.count);
  return { list, range: timeRangeOf(list.length ? list : CHARS) };
}
function startSolo() {
  const d = DIFF[CUR.diff];
  const tset = pickTraceSet(CUR.diff);
  /* 出题去重（何何老师 2026-10-06 定稿）：去重生命周期=一局——开局建去重集（识铭 6 字 → 辨铭从

  if (cchars.length < QUIZ_DISCERN_N) {   /* 兜底：相似池不足时从其余未用字补齐（同局仍不重复） */
    shuffle(CHARS.filter(c => !dchars.includes(c) && !cchars.includes(c)))

      .forEach(c => cchars.push(c));

function compareHTML(q, chosen) {
  const sc = q.stemSc || SCRIPT;
  if (!chosen || chosen === q.ch) return '';
  const one = (c, cap) => '<span style="display:inline-flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.6);border-radius:10px;padding:4px 10px;margin:0 4px;vertical-align:middle">' + svgOf(c, sc) + '<span style="font-size:11px;color:var(--muted)">' + esc(cap) + '</span></span>';
  return '<div style="margin-top:8px">' + one(q.ch, '正确 ' + q.ch) + one(chosen, '你选 ' + chosen) + '</div>';

function answerQuiz(btn, q, mode) {
  const feed = $('qFeed');
  const ok = btn.dataset.o === q.ch;
  document.querySelectorAll('#' + (mode === 'd' ? 's2' : 's3') + ' .opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.o === q.ch) b.classList.add('right');
  });
  if (!ok) btn.classList.add('wrong');
  if (mode === 'd') { S.dmarks += ok ? MARK_DETECT : 0; const m = $('qMarks'); if (m) m.textContent = S.dmarks; }
  else { S.cmarks += ok ? MARK_DISCERN : 0; const m = $('qMarks'); if (m) m.textContent = S.cmarks; }
  if (ok) { S.streak = (S.streak || 0) + 1; S.maxStreak = Math.max(S.maxStreak || 0, S.streak); }
  else { S.streak = 0; if ((S.wrongChars || []).indexOf(q.ch) < 0) (S.wrongChars = S.wrongChars || []).push(q.ch); }
  const se = $('streakEl'); if (se) se.textContent = S.streak >= 2 ? '🔥 连对 ' + S.streak : '';
  const info = DZINFO[q.ch];

  else { feed.className = 'qFeed bad'; feed.innerHTML = '✘ 正确是「' + q.ch + '」— ' + info.sw + compareHTML(q, btn.dataset.o); sndWrong(); }
  later(() => {
    const idx = mode === 'd' ? ++S.di : ++S.ci;

      dead = true;
      clearInterval(ivId);
      const opts = document.querySelectorAll((CUR_PAGE === P_DETECT ? '#s2' : '#s3') + ' .opt');
      let hit = null;
      opts.forEach(b => { b.disabled = true; if (b.dataset.o === (CUR_PAGE === P_DETECT ? S.dq[S.di] : S.cq[S.ci]).ch) hit = b; });
      if (hit) hit.classList.add('right');
      const feed = $('qFeed');
      feed.className = 'qFeed bad'; feed.textContent = '⏰ 超时！' + label + '要眼疾手快哦';
      sndWhoops();
      later(() => {
        const idx = CUR_PAGE === P_DETECT ? ++S.di : ++S.ci;
        const total = CUR_PAGE === P_DETECT ? S.dq.length : S.cq.length;
        if (idx < total) (CUR_PAGE === P_DETECT ? renderDetect() : renderDiscern());
        else if (CUR_PAGE === P_DETECT) { go(P_DISCERN); }
        else { go(P_TRACE); }
      }, 1000);
    }
  }, 1000);
}

function onInkChange() {

  const ch = S.tList[S.ti];
  const used = INK.used();
  if (!used.length) { resetTrPanel(); return; }
  const r = judgeScore(used, ch);
  const v = $('trVerdict');
  if (v) v.textContent = `草评：贴合 ${Math.round(r.prec * 100)} · 覆盖 ${Math.round(r.recall * 100)} —— 满意就点「提交判定」`;
}
function resetTrPanel() {
  const v = $('trVerdict'); if (v) v.textContent = '照着青铜上的灰字描，一笔一笔来。';

}
function startTraceTimer() {
  const tEl = $('qTimer');
  if (!S.timed || !tEl) { if (tEl) tEl.textContent = ''; return; }
  S.tLeft = timeOf(S.tList[S.ti]);
  tEl.textContent = S.tLeft + 's';
  every(() => {
    S.tLeft--;
    tEl.textContent = S.tLeft + 's';
    tEl.classList.toggle('urgent', S.tLeft <= 3);
    if (S.tLeft <= 3 && S.tLeft > 0) sndTick();

}
function trSubmit(timedOut) {
  const ch = S.tList[S.ti];
  const used = INK.used();
  TIMERS.splice(0).forEach(id => { clearTimeout(id); clearInterval(id); });
  if (!used.length && !timedOut) { toast('先描几笔再提交哦'); return; }
  const r = judgeScore(used, ch, { timed: !!S.timed, wholeZero: !!(S.timed && S.diff === 'nightmare') });
  S.tScores[ch] = r.score;
  INK.setLock(true);
  const v = $('trVerdict');
  const pass = r.score >= CAST_PASS;
  v.innerHTML = timedOut && !used.length ? '⏰ 超时未交卷 — 0 分'
    : (pass ? `🎉 <b style="color:var(--ok)">${r.score} 分 · 可以铸上铜鼎！</b>` : `💦 <b style="color:var(--cin)">${r.score} 分 · 差一点，这个字先不铸</b>`)
    + (r.zeroed ? ' · 梦魇规则：缺一笔整字归零' : '')
    + (r.unfinished ? ` · 未写完 ${r.unfinished} 笔` : '');
  const sc = $('trScores');
  sc.style.display = '';
  sc.innerHTML = `
    <span class="scoreTag">贴合 <b>${Math.round(r.prec * 100)}</b></span>
    <span class="scoreTag">覆盖 <b>${Math.round(r.recall * 100)}</b></span>

  $('trStrokes').innerHTML = r.strokes.map((st, i) => {
    const cls = st.unfinished ? 'unfinished' : (st.doneR >= 0.8 && st.meanDev <= 10 ? 'ok' : 'bad');
    return `<span class="sChip ${cls}" title="覆盖${Math.round(st.doneR * 100)}% · 偏离${st.meanDev ? st.meanDev.toFixed(1) : '-'}px">${i + 1}</span>`;
  }).join('');
  $('btnTrSubmit').style.display = 'none';
  if (!pass && (S.rLeft || 0) > 0) { const rb = $('btnTrRetry'); if (rb) rb.style.display = ''; }
  $('btnTrNext').style.display = '';
  $('btnTrNext').textContent = S.ti === S.tList.length - 1 ? '去铸鼎 ⏭' : '下一字 ⏭';
  if (pass) { sndJudge(); floatScore(String(r.score), $('trCvHost')); } else sndWrong();
}

function renderCast() {
  const s = $('s5');

  const fail = entries.filter(e => e.score < CAST_PASS);
  s.innerHTML = `
  <div class="castWrap">
    <div class="h1">🔥 铸 鼎 仪 式</div>
    <div class="sub">铸造工匠把写合格的字铸上王鼎 —— 合格线 ${CAST_PASS} 分，今日合格 <b style="color:var(--gold-hi)">${pass.length}</b> 字</div>
    <div class="dingBox">${DING_SVG}<div id="dingSlots">${CHARS.map(() => '<div class="slotChar"></div>').join('')}</div></div>
    <div class="castCaption" id="castCap">铜水已备，史官就位……</div>
    <div style="margin-top:10px"><button class="btn gold" id="btnCastGo" style="display:none">去结算 ➜</button></div>
  </div>`;
  const slots = s.querySelectorAll('.slotChar');
  /* 槽位顺序：按 lv 分层排布（先易后难），写合格的字入槽 */
  const ordered = CHARS.slice();
  let delay = 500;
  if (!pass.length) {
    $('castCap').textContent = '今日无一字合格 —— 西周铸铭，讲究的就是千锤百炼。再来一次！';
    sndWhoops();
    $('btnCastGo').style.display = '';
  } else {
    /* 落字随机化（何何老师 2026-10-06 定稿）：顺序洗牌不按固定次序；来向上下左右随机；
       距离 60~130px + 垂直抖动 ±12px；间隔 200~480ms 随机——各字仍落回自己的铭文槽位 */
    const order = shuffle(pass.slice());
    order.forEach((e, i) => {
      later(() => {
        const slot = Array.from(slots)[ordered.indexOf(e.ch)];
        if (slot) {
          const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
          const [ux, uy] = dirs[(Math.random() * 4) | 0];
          const dist = 60 + Math.random() * 70;
          const px = ux ? 0 : Math.random() * 24 - 12;
          const py = uy ? 0 : Math.random() * 24 - 12;
          slot.style.setProperty('--dx', (ux * dist + px).toFixed(1) + 'px');
          slot.style.setProperty('--dy', (uy * dist + py).toFixed(1) + 'px');
          slot.textContent = e.ch;
          slot.classList.add('in', 'flash');   /* 字带金边落鼎：charDrop（向量由 --dx/--dy 注入）渐亮渐宽 → 落定 charFlash 1s（class 不移除，播完自然回归） */
        }
        $('castCap').innerHTML = `正在浇铸 <b>「${esc(e.ch)}」</b>（${e.score} 分）……`;
        later(sndSeal, 550);   /* 封印音效对齐落定瞬间（charDrop 下落 0.55s），走 TIMERS 离屏自清 */
        if (i === order.length - 1) {
          later(() => {
            $('castCap').innerHTML = `青铜大器告成！今日铸字 <b>${pass.length}</b>，拓片入库 🏛️${fail.length ? ` · 未合格 ${fail.length} 字继续加油` : ''}`;
            const db = s.querySelector('.dingBox');
            if (db) db.classList.add('dingFlash');   /* 全部铸完：整鼎高亮闪烁 2s */
            sndWin(); startFx();
            mergeRubbings(pass);
            $('btnCastGo').style.display = '';
          }, 600);
        }
      }, delay);
      delay += 200 + Math.random() * 280;   /* 间隔随机 200~480ms（原固定 340） */
    });
  }
  $('btnCastGo').onclick = () => {
    stopFx();
    finishSoloSave();   /* 入榜结果在结算页由「刷新个人最佳/未超最佳」标签承载，此处不再弹 toast（会压住结算页标题） */
    go(P_ANIM_SOLO);
    /* playClimb 约定：list[0] = 第 1 名（最佳在前），内部从队尾最差名次开始逐个打飞 */
    const { head } = topForClimb(DB.solo.filter(r => r.diff === S.diff), betterSolo, 8);
    playClimb(head, 'soloStage', 'solo', () => go(P_RESULT));

/* 单人成绩入榜（同名同难度去重保最佳），返回 {rec, improved, old}；
   抬杠纪律：入榜动作只发生一次（S.saved 幂等闸门），供铸鼎按钮与结算页共用 */
function finishSoloSave() {
  if (S.saved) return S.savedRec;
  const scores = S.tList.map(ch => S.tScores[ch] || 0);
  const avg = scores.length ? r1(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
  const rec = {
    name: CUR.playerName || DB.soloName || '我', diff: S.diff, timed: !!S.timed, traceTotal: avg, traceAvg: avg,
    marks: S.dmarks + S.cmarks, words: S.tList.length,
    rows: S.tList.map(ch => ({ ch, score: S.tScores[ch] || 0 })),
    time: Math.round((Date.now() - S.t0) / 1000), ts: Date.now()
  };
  const res = keepBest(DB.solo, rec, betterSolo);
  saveDB();
  lastTs = [res.rec.ts];   /* 本轮铭牌在揭榜动画与榜单里高亮 */
  S.saved = true;
  S.savedRec = { rec: res.rec, improved: res.improved, old: res.old };
  return S.savedRec;
}
function mergeRubbings(pass) {
  const p = curPlayer(), m = (DB.rubBy[p] = DB.rubBy[p] || {});
  pass.forEach(e => { m[e.ch] = Math.max(m[e.ch] || 0, Math.round(e.score)); });
  saveDB();
}

function dianPickChars(n) {
  const taken = [];
  const heads = shuffle(Object.keys(SIMILAR).filter(c => CHARS.indexOf(c) >= 0 && SIMILAR[c] && SIMILAR[c].length));
  for (const h of heads) {
    if (taken.length + 2 > n) break;
    if (taken.indexOf(h) >= 0) continue;
    const p = SIMILAR[h].find(x => CHARS.indexOf(x) >= 0 && taken.indexOf(x) < 0);
    if (p) taken.push(h, p);

  } else {
    s.innerHTML = `
    <div class="dianStage">
      <div class="dianBanner">⚔️ 双人点将 PK · 同题同字同乱序 —— 各自按次序点将，先答完者点「下一关」立即前进，无需等对手</div>
      <div class="dianPk">
        <div class="dianHalf" id="dh_L"></div>
        <div class="dianDivider"></div>

}
function dianHalfHTML(side, st) {
  const r = st.ri, round = st.rounds[r], n = round.n, ph = st.phase, isDuo = side !== 'M';
  const tier = DIAN_TIERS[st.tier] || DIAN_TIERS.rookie;
  const limit = tier.limits ? tier.limits[n] : null;   /* 该关答题限时（秒）；菜鸟=null 不限时 */
  const name = isDuo ? DIAN2.names[side === 'L' ? 0 : 1] : st.name;
  const cells = ph === 'mem'
    ? Array.from({ length: n }, () => dianCellHTML('', ''))
    : round.off.map(ch => dianCellHTML(ch, 'lit stamped ' + (st.marks[ch] || ''), st.clicks.indexOf(ch) + 1));
  const grid = `<div class="dianGrid">${cells.join('')}</div>`;
  const hint = ph === 'mem'
    ? `第 ${'一二三四'[r]}关 · 军阵列队中 —— 每秒现一字，共 ${n} 字 ${n} 秒，记住次序！`
    : (ph === 'recall' ? (limit ? `军阵已换位 —— 按<b>刚才的次序</b>依次点将（限时 <b>${limit} 秒</b>）！` : '军阵已换位 —— 按<b>刚才的次序</b>依次点将！')
      : '判定完毕 —— 标绿=位置正确');
  const bar = (limit && ph === 'recall')
    ? `<div class="tmbar dianBar"><i></i></div><div class="dianBarNum" data-bar-num>${st.tLeft || limit}s</div>`
    : '';
  const okBtn = ph === 'mem'
    ? `<button class="btn dianOk" disabled>确 定</button>`
    : ph === 'recall'
      ? `<button class="btn gold dianOk">确 定</button>`
      : `<button class="btn gold dianOk">${r < st.rounds.length - 1 ? '下一关 ⏭' : (isDuo ? '完成 ⏭' : '去结算 ⏭')}</button>`;
  const feed = ph === 'feed'
    ? `<div class="dianFeed ${st.lastHits === n ? 'good' : (st.lastHits ? 'mid' : 'bad')}">答对 <b>${st.lastHits}</b> / ${n} · ${st.lastHits ? '+' + st.lastHits * DIAN_PT + ' 分' : '再接再厉'}</div>`
    : `<div class="dianFeed"></div>`;
  const main = `<div class="dianMain">
      <div class="dianHalfName">${esc(name)}</div>
      <div class="dianScoreTag">${esc(tier.icon)} ${esc(tier.label)}档 · 累计 <b>${st.score}</b> 分</div>
      ${grid}<div class="dianMemHint">${hint}</div>${bar}</div>`;
  const ctl = `<div class="dSide">${okBtn}${ph === 'recall' ? `<div class="dianCount">已点 <b>${st.clicks.length}</b> / ${n}</div>` : ''}${feed}</div>`;
  /* 确认键位置（何何老师定稿）：分屏时在答题区相邻处（中缝两侧）垂直居中，
     不在屏幕底部 —— L 侧确认键在答题区右缘、R 侧在其左缘，两键环抱中缝；单人 = 右侧居中 */
  return (isDuo && side === 'R') ? ctl + main : main + ctl;
}
function dianCellHTML(ch, cls, stamp) {
  return `<div class="dcell ${cls || ''}"${ch ? ` data-ch="${esc(ch)}"` : ''}>${ch ? dianGlyphHTML(ch) : ''}${stamp ? `<span class="dstamp">${stamp}</span>` : ''}</div>`;
}
function dianGlyphHTML(ch) { return svgOf(ch); }   /* 反白由 CSS `.dcell svg path{fill:!important}` 覆盖（rubCard 同法） */
function dianRenderHalf(side) {
  const st = dianStateOf(side);
  const host = document.getElementById('dh_' + side);
  if (!host || !st) return;
  host.innerHTML = dianHalfHTML(side, st);
  if (st.phase === 'mem') dianScheduleMem(side, st);
  else if (st.phase === 'recall') dianWireRecall(side, st);
  else if (st.phase === 'feed') dianWireFeed(side, st);
}

/* ---------- 记忆阶段：每秒亮一字（300ms 起拍），N 字 N 秒后全体隐去 → 倒计时特效 → 换位 ---------- */
function dianScheduleMem(side, st) {
  const round = st.rounds[st.ri], n = round.n, seq = round.seq;
  const host = document.getElementById('dh_' + side);
  const grid = host.querySelector('.dianGrid');
  st.phase = 'mem'; st.step = 0; st.clicks = []; st.marks = {};
  const alive = () => dianStateOf(side) === st && st.phase === 'mem';   /* 换局/重开/离屏即失效 */
  for (let i = 0; i < n; i++) {
    later(() => {
      if (!alive() || st.step !== i) return;
      const cell = grid.children[i];
      if (!cell) return;
      st.step = i + 1;
      cell.dataset.ch = seq[i];
      cell.innerHTML = dianGlyphHTML(seq[i]);
      cell.classList.add('lit');
      sndTick();
    }, 300 + i * 1000);
  }
  later(() => {
    if (!alive()) return;
    [...grid.children].forEach(c => { c.classList.remove('lit'); c.classList.add('gone'); c.innerHTML = ''; delete c.dataset.ch; });
    later(() => {
      if (!alive()) return;
      /* 字消瞬间（何何老师 V3.2 定稿）：倒计时特效供回忆思考（菜鸟 5 秒 / 困难 3 秒 / 梦魇 1 秒），
         播完才亮换位军阵开答 —— 特效在各自半屏内居中（分屏互不遮掩） */
      dianCdnPlay(side, st, () => { if (dianStateOf(side) === st) dianToRecall(side, st); });
    }, 620);
  }, 300 + n * 1000);
}
/* 倒计时特效序列：每项火焰大字瞬间放大 3 倍→缩回原大→消失，依次更替；
   菜鸟 Ready.../3/2/1/Go! 各 1 秒（共 5 秒）、困难同序列各 0.6 秒（共 3 秒）、梦魇只 Go! Go! Go! 1 秒 */
function dianCdnPlay(side, st, onDone) {
  const tier = DIAN_TIERS[st.tier] || DIAN_TIERS.rookie;
  const host = document.getElementById('dh_' + side);
  if (!host) { if (onDone) onDone(); return; }
  const ov = document.createElement('div');
  ov.className = 'dianCdn';
  host.appendChild(ov);
  let i = 0;
  const aliveCdn = () => dianStateOf(side) === st && document.getElementById('dh_' + side) === host;
  const step = () => {
    if (!aliveCdn()) { ov.remove(); return; }
    if (i >= tier.cdn.length) { ov.remove(); if (onDone) onDone(); return; }
    const d = document.createElement('div');
    d.className = 'dianCdnNum';
    d.textContent = tier.cdn[i];
    d.style.animationDuration = Math.max(280, Math.round(tier.cdnMs * 0.92)) + 'ms';
    ov.appendChild(d);
    sndTick();
    i++;
    later(() => { d.remove(); step(); }, tier.cdnMs);
  };
  step();
}
function dianToRecall(side, st) {
  st.phase = 'recall';
  dianRenderHalf(side);
  /* 限时档（困难/梦魇）：Go 即起倒计时条+音效，超时按已点自动判定；菜鸟不限时 */
  const tier = DIAN_TIERS[st.tier] || DIAN_TIERS.rookie;
  const n = st.rounds[st.ri].n;
  const limit = tier.limits ? tier.limits[n] : null;
  if (limit) dianBarStart(side, st, limit, () => dianJudge(side, st));
}
/* 答题倒计时条（限时档）：不断缩短 + 每秒音效 + 收尾加急；确认即停 */
function dianBarStart(side, st, secs, onEnd) {
  const host = document.getElementById('dh_' + side);
  const bar = host && host.querySelector('.dianBar');
  if (!bar) { if (onEnd) onEnd(); return; }
  const fill = bar.querySelector('i');
  const num = host.querySelector('[data-bar-num]');
  st.tLeft = secs;
  fill.style.width = '100%';
  num.textContent = secs + 's';
  const iv = every(() => {
    if (dianStateOf(side) !== st || st.phase !== 'recall') { clearInterval(iv); return; }
    st.tLeft--;
    fill.style.width = Math.max(0, st.tLeft / secs * 100) + '%';
    num.textContent = Math.max(0, st.tLeft) + 's';
    bar.classList.toggle('urgent', st.tLeft <= Math.max(2, Math.round(secs * 0.25)));
    if (st.tLeft <= 3 && st.tLeft > 0) sndTick();
    if (st.tLeft <= 0) { clearInterval(iv); st.barIv = null; sndWhoops(); if (onEnd) onEnd(); }
  }, 1000);
  st.barIv = iv;
}

/* ---------- 还原阶段：点将盖序号（可撤销、序号压实），确定即判定 ---------- */
function dianWireRecall(side, st) {
  const host = document.getElementById('dh_' + side);
  const grid = host.querySelector('.dianGrid');
  const refresh = () => {
    [...grid.children].forEach(cell => {
      const ch = cell.dataset.ch, k = st.clicks.indexOf(ch) + 1;
      const tag = cell.querySelector('.dstamp');
      if (k && tag) tag.textContent = k;
      else if (k) cell.insertAdjacentHTML('beforeend', `<span class="dstamp">${k}</span>`);
      else if (tag) tag.remove();
      cell.classList.toggle('stamped', !!k);
    });
    const cnt = host.querySelector('.dianCount b');
    if (cnt) cnt.textContent = st.clicks.length;
  };
  [...grid.children].forEach(cell => {
    cell.onclick = () => {
      if (st.phase !== 'recall') return;
      const ch = cell.dataset.ch, at = st.clicks.indexOf(ch);
      if (at >= 0) st.clicks.splice(at, 1); else st.clicks.push(ch);
      sndTick(); refresh();
    };
  });
  host.querySelector('.dianOk').onclick = () => dianJudge(side, st);
}
/* 判定：点选序位 == 原次序（点中的第 k 字正是当初第 k 个亮的字）才算答对。
   限时档严格按"限时内实际点选"计 —— 超时自动判定与提前确定走同一条路 */
function dianJudge(side, st) {
  if (st.phase !== 'recall') return;
  if (st.barIv) { clearInterval(st.barIv); st.barIv = null; }   /* 提前交卷即停表 */
  const r = st.ri, n = st.rounds[r].n, seq = st.rounds[r].seq;
  let hits = 0;
  st.clicks.forEach((ch, k) => { if (seq[k] === ch) hits++; });
  st.lastHits = hits;
  st.score += hits * DIAN_PT;
  st.per.push(hits);
  st.marks = {};
  const host = document.getElementById('dh_' + side);
  [...host.querySelectorAll('.dcell')].forEach(cell => {
    const ch = cell.dataset.ch, k = st.clicks.indexOf(ch) + 1;
    if (!k) { st.marks[ch] = 'dim'; return; }
    st.marks[ch] = seq[k - 1] === ch ? 'right' : 'wrong';
  });
  st.phase = 'feed';
  dianRenderHalf(side);
  (hits === n ? sndRight : (hits ? sndJudge : sndWrong))();
}
function dianWireFeed(side, st) {
  const host = document.getElementById('dh_' + side);
  const btn = host.querySelector('.dianOk');
  if (btn) btn.onclick = () => {
    if (st.phase !== 'feed') return;
    st.ri++;
    if (st.ri < st.rounds.length) { st.phase = 'mem'; dianRenderHalf(side); }
    else dianFinishSide(side, st);
  };
}
function dianFinishSide(side, st) {
  if (side === 'M') {
    DIAN.done = true;
    dianSaveSolo();
    dianGoClimbSolo();
  } else {
    DIAN2[side].done = true;
    const host = document.getElementById('dh_' + side);
    if (host) host.innerHTML = `<div class="boardEmpty" style="padding:40px 0">⚔️ 三关点毕！战报汇总中……</div>`;
    if (DIAN2.L.done && DIAN2.R.done) dianEndDuo();
  }
}

/* ---------- 成绩入库（同名保最佳，keepBest 复用）与结算 ---------- */
/* 该难度点兵榜前三名名单（solo+duo 合并 —— 同档内单人/双人是同一任务，可比）；
   V3.1 及更早的记录无 diff 字段 → 视作菜鸟档 */
function dianTop3Names(diffKey) {
  const store = dianStore();
  const list = store.solo.concat(store.duo).filter(r => (r.diff || 'rookie') === diffKey);
  return list.slice().sort((a, b) => betterDian(a, b) ? -1 : 1).slice(0, 3).map(r => r.name);
}
function dianSaveSolo() {
  const st = DIAN;
  if (st.saved) return;
  st.saved = true;
  const slots = st.rounds.reduce((a, b) => a + b.n, 0);
  const oldTop3 = dianTop3Names(st.tier);
  const rec = {
    name: st.name, mode: 'solo', diff: st.tier, score: st.score,
    hits: st.per.reduce((a, b) => a + b, 0), slots,
    per: st.per.slice(), time: Math.round((Date.now() - st.t0) / 1000), ts: Date.now()
  };
  keepBest(dianStore().solo, rec, betterDian);
  lastTs = [rec.ts];
  saveDB();
  const newWinner = dianTop3Names(st.tier).filter(nm => oldTop3.indexOf(nm) < 0);
  DIAN_LAST = { mode: 'solo', tier: st.tier, name: st.name, score: st.score, per: st.per.slice(), time: rec.time, newWinner };
}
function dianEndDuo() {
  DIAN2.done = true;
  if (!DIAN2.saved) {
    const t = Math.round((Date.now() - DIAN2.t0) / 1000);
    const win = DIAN2.L.score > DIAN2.R.score ? 'L' : (DIAN2.R.score > DIAN2.L.score ? 'R' : 'T');
    const store = dianStore();
    const nmOf = sd => DIAN2.names[sd === 'L' ? 0 : 1];   /* 名字在 DIAN2.names[]，侧状态无 name 字段 */
    const slots = DIAN2.rounds.reduce((a, b) => a + b.n, 0);
    const oldTop3 = dianTop3Names(DIAN2.tier);
    const push = (sd, rv, ts) => keepBest(store.duo, {
      name: nmOf(sd), rival: nmOf(rv), mode: 'duo', diff: DIAN2.tier, score: DIAN2[sd].score,
      hits: DIAN2[sd].per.reduce((a, b) => a + b, 0), slots,
      win: win === 'T' ? 'T' : (win === sd ? 'W' : 'L'), time: t, ts
    }, betterDian);
    const rL = push('L', 'R', Date.now() + 1), rR = push('R', 'L', Date.now() + 2);
    lastTs = [rL.rec.ts, rR.rec.ts];
    saveDB();
    DIAN2.saved = true;
    const newWinner = dianTop3Names(DIAN2.tier).filter(nm => oldTop3.indexOf(nm) < 0);
    DIAN_LAST = {
      mode: 'duo', tier: DIAN2.tier, win,
      L: { name: nmOf('L'), score: DIAN2.L.score, per: DIAN2.L.per.slice() },
      R: { name: nmOf('R'), score: DIAN2.R.score, per: DIAN2.R.per.slice() },
      newWinner
    };
  }
  go(P_ANIM_DUO);
  /* 爬榜=本难度子榜（2026-10-08 何何老师复核定稿：跨难度踢飞=越界，三档实力不可比）；
     旧档无 diff → 菜鸟档 */
  const { head } = topForClimb(dianStore().duo.filter(r => (r.diff || 'rookie') === DIAN2.tier), betterDian, 8);
  playClimb(head, 'duoStage', 'duo', () => go(P_DIAN_RES));
}
function dianGoClimbSolo() {
  go(P_ANIM_SOLO);
  const { head } = topForClimb(dianStore().solo.filter(r => (r.diff || 'rookie') === DIAN.tier), betterDian, 8);
  playClimb(head, 'soloStage', 'dian', () => go(P_DIAN_RES));
}

/* ---------- 点兵榜（拓片墙新页签 + 结算页内嵌共用同一渲染；按难度分档 2026-10-08） ---------- */
function dianBoardHTML(limit, diffFilter) {
  const store = dianStore();
  const list = store.solo.map(r => Object.assign({ kind: '单人' }, r))
    .concat(store.duo.map(r => Object.assign({ kind: 'PK' }, r)))
    .filter(r => !diffFilter || (r.diff || 'rookie') === diffFilter);   /* 旧档无 diff → 菜鸟档 */
  if (!list.length) return { html: '<div class="boardEmpty">点兵簿上还无名将 —— 先去点兵点将练一阵！<br><span style="font-size:12px;color:var(--muted)">（成绩与主线一致：打完整局才会记榜，中退不计；记榜后存于本机 localStorage，刷新不丢）</span></div>', rows: 0 };
  const sorted = list.slice().sort((a, b) => betterDian(a, b) ? -1 : 1).slice(0, limit || 12);
  const medal = i => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
  const html = `<table class="rk"><tr><th>#</th><th>将军</th><th>对局</th><th>总分</th><th>答对</th><th>日期</th></tr>

      <td>${new Date(r.ts).toLocaleDateString()}</td></tr>`).join('')}</table>`;
  return { html, rows: sorted.length };
}

     3 秒内任何一次 go() 的 stopAll() 都会清掉定时器 → 特效层永久泄漏到后续所有页面（实测踩坑）。
     故用原生 setTimeout：切页也要在 3 秒后自毁 */
  const stale = document.getElementById('nwFx');
  if (stale) stale.remove();

    p.style.animationDelay = (Math.random() * 0.9).toFixed(2) + 's';

}

/* 学号序列捷径（复刻 v6.6.618 seqRoster）：先问首位、再问末位 → 生成全部连续学号（姓名行保留在前） */
function seqRoster() {
  const t = document.getElementById('rosterArea');
  const lines = (t.value || '').split(/\n+/).map(x => x.trim()).filter(Boolean);
  const inBox = lines.map(x => /^\d+$/.test(x) ? x : '').find(Boolean) || '';
  const sIn = prompt('序列【第一个】学号是？', inBox);
  if (sIn === null) return;
  const start = /^\d+$/.test(sIn.trim()) ? +sIn.trim() : NaN;
  if (isNaN(start)) { toast('第一个学号无效（需纯数字）', true); return; }
  const eIn = prompt('序列【最后一个】学号是？（将自动生成 ' + start + ' ~ 末号 的连续学号）', String(start));
  if (eIn === null) return;
  const end = /^\d+$/.test(eIn.trim()) ? +eIn.trim() : NaN;
  if (isNaN(end) || end < start) { toast('末尾学号无效（需 ≥ ' + start + '）', true); return; }
  if (end - start > 500) { toast('一次最多生成 500 个连续学号', true); return; }
  const names = lines.filter(x => !/^\d+$/.test(x));
  const seq = [];
  for (let n = start; n <= end; n++) seq.push(String(n));
  t.value = names.concat(seq).join('\n');
  toast('已生成 ' + seq.length + ' 个连续学号（' + start + ' ~ ' + end + '）');
}
function rosterParse(txt) {
  return String(txt || '').split(/[\n,，、;；\t]+/).map(x => x.trim()).filter(Boolean);
}
function rosterDrawTwo() {
  const names = rosterParse(($('rosterArea') || {}).value);
  if (names.length < 2) { toast('名单至少要两个人才能抽签哦', true); return; }
  const pick = shuffle(names).slice(0, 2);
  $('duoA').value = pick[0].slice(0, 8);
  $('duoB').value = pick[1].slice(0, 8);
  sndSeal(); toast('抽中：' + pick[0] + ' VS ' + pick[1]);
}

function startDuo() {
  const a = ($('duoA').value || '').trim() || '史官甲';
  const b = ($('duoB').value || '').trim() || '史官乙';
  if (a === b) { toast('两位选手不能同名（榜单要按名字区分）', true); return; }
  const cfg = PK_ROUNDS[CUR.diff];
  /* 题组：描红字沿用分层校准的 pickTraceSet（难度曲线不变）；辨铭题从其余字里抽，绝不与描红字重叠；
     同场辨铭零重复（2026-10-06 规则，去重生命周期=本场：结算即作废，下一场从头再来） */
  const tset = pickTraceSet(CUR.diff);
  const traceChars = tset.list.slice(0, cfg.t);
  const discPool = shuffle(CHARS.filter(c => !tset.list.includes(c))).slice(0, cfg.d);
  const plan = [];
  discPool.forEach(ch => plan.push({ kind: 'discern', q: mkQuestion(ch, 'b2s') }));
  traceChars.forEach(ch => plan.push({ kind: 'trace', ch }));
  PK = {
    names: [a, b], diff: CUR.diff, timed: !!CUR.timed,
    L: { name: a, score: 0 }, R: { name: b, score: 0 },
    plan, ri: 0, lock: { L: false, R: false }, answered: {},
    traceScores: { L: null, R: null },
    t0: Date.now(), saved: false, over: false
  };
  toast('PK 开始 · ' + DIFF[PK.diff].name + '难度 · ' + plan.length + ' 轮（辨铭 ' + cfg.d + ' + 写铭 ' + cfg.t + '）· 双方同题同字');
  go(P_DUO);   /* go() 触发 renderPkIdle → PK 已就绪即渲染首轮（勿再手动 renderPk，双渲染会让首帧 InkBox 重建） */
}

function pkHp() {
  const tot = PK.L.score + PK.R.score;
  let share = tot > 0 ? PK.L.score / tot : 0.5;
  share = Math.max(0.06, Math.min(0.94, share));   /* 留边：领先方不完全吃掉血条 */
  const pct = Math.round(share * 100);
  /* ≥56% 优势方爆闪、≤44% 弱势方呼吸（继承 v6.6.618），势均力敌无特效 */
  const lCls = pct >= 56 ? ' dominant' : (pct <= 44 ? ' weak' : '');
  const rCls = pct <= 44 ? ' dominant' : (pct >= 56 ? ' weak' : '');
  const sparks = [];
  for (let i = 1; i <= 8; i++) sparks.push('<i class="spark s' + i + '"></i>');
  return '<div class="hpwrap">' +
    '<div class="hp"><i class="l' + lCls + '" style="width:' + (share * 100) + '%"></i>' +
    '<i class="r' + rCls + '" style="width:' + ((1 - share) * 100) + '%"></i></div>' +
    '<div class="boltwrap" style="left:' + (share * 100) + '%"><i class="bolt"></i>' + sparks.join('') + '</div>' +
    '</div>';
}

function pkBarStart(LIM, onEnd) {
  pkBarStop();
  const bar = document.getElementById('pkBar');
  if (!bar) return;
  bar.style.display = ''; bar.classList.remove('urgent');
  const fill = bar.querySelector('i'); fill.style.width = '100%';
  const URG = Math.max(1.5, LIM * 0.25);
  PK.tLeft = LIM;
  PK.cdId = every(() => {
    PK.tLeft--;
    if (fill) fill.style.width = Math.max(0, PK.tLeft / LIM * 100) + '%';
    bar.classList.toggle('urgent', PK.tLeft <= URG);
    if (PK.tLeft <= 3 && PK.tLeft > 0) sndTick();
    if (PK.tLeft <= 0) { pkBarStop(); onEnd(); }
  }, 1000);
}
function pkBarStop() { if (PK && PK.cdId) { clearInterval(PK.cdId); PK.cdId = null; } }
function pkTimeout() {
  ['L', 'R'].forEach(sd => { PK.lock[sd] = true; });
  document.querySelectorAll('#s8 .pkoptbox .opt').forEach(x => {
    x.classList.add('locked');
    if (x.dataset.o === PK.plan[PK.ri].q.ch) x.classList.add('right');
  });
  toast('⏱ 本轮超时，双方均未得分', true, 1500);
  sndWhoops();
  later(() => { PK.ri++; renderPk(); }, 900);
}
function pkAnswer(side, el) {
  if (PK.over || PK.ri >= PK.plan.length) return;
  const r = PK.plan[PK.ri];
  if (r.kind !== 'discern' || PK.lock[side]) return;
  PK.lock[side] = true;
  const ok = el.dataset.o === r.q.ch;
  const box = document.getElementById('pkOpt' + side);
  box.querySelectorAll('.opt').forEach(x => {
    x.classList.add('locked');
    if (x.dataset.o === r.q.ch) x.classList.add('right');
    else if (x === el) x.classList.add('wrong');
    else x.classList.add('dim');
  });
  if (ok) {
    const first = !PK.answered[r.q.ch];
    const gain = first ? PK_GAIN.first : PK_GAIN.second;
    if (first) PK.answered[r.q.ch] = true;
    PK[side].score = r1(PK[side].score + gain);
    sndRight(); floatScore(el, '+' + gain, side === 'L' ? '#e07b52' : '#7cc4a4');
  } else { sndWrong(); floatScore(el, '✕', '#ff8f83'); }
  setPkV(side, PK[side].score);
  refreshHp();
  if (PK.lock.L && PK.lock.R) {
    pkBarStop();
    const q = r.q, feed = $('pkFeed');
    if (feed) { feed.className = 'qFeed good'; feed.innerHTML = '正确答案：「' + esc(q.ch) + '」— ' + esc(DZINFO[q.ch].sw); }
    later(() => { PK.ri++; renderPk(); }, 1200);

let climbCtl = null;
function stopClimb() {
  if (climbCtl) {
    climbCtl.cancel = true;

    climbCtl.timers.forEach(clearTimeout); climbCtl = null;

}
function skipClimb() {
  if (!climbCtl) return;
  const cb = climbCtl.onDone;
  climbCtl.skip = true;
  climbCtl.audioTimers && climbCtl.audioTimers.forEach(clearTimeout);
  climbCtl.timers.forEach(clearTimeout);
  finishClimb(); if (cb) cb();
}
function finishClimb() {
  if (!climbCtl) return;
  const st = climbCtl.stage, rec = climbCtl.lastRec, kind = climbCtl.kind;
  climbCtl = null;
  /* 跳过时也要保留完整的 .plate 外壳 —— 否则 hero 金光样式（.plate.hero）不会生效 */
  if (st) {
    st.innerHTML = '';
    st.appendChild(plateNode(rec, kind, 'hero'));

}
function climbT(ctl, fn, ms) {
  if (ctl.cancel) return;
  const t = setTimeout(() => { if (ctl.cancel || ctl.skip) return; fn(); }, ms);
  ctl.timers.push(t); return t;
}

/* 播完动画自动进结算页（onDone 回调），另有「跳过动画」按钮 */
function playClimb(list, stageId, kind, onDone) {
  const st = document.getElementById(stageId);
  if (!st || !list.length) { if (onDone) onDone(); return; }
  stopClimb();
  const ctl = { cancel: false, skip: false, timers: [], audioTimers: [], stage: st,
    lastRec: list[0], kind: kind, onDone: onDone || null };
  climbCtl = ctl;
  st.innerHTML = '';
  let idx = list.length - 1;
  let cur = plateNode(list[idx], kind, 'cur');
  st.appendChild(cur); idx--;
  if (idx < 0) {
    climbT(ctl, () => {
      st.innerHTML = ''; st.appendChild(plateNode(list[0], kind, 'hero'));
      ctl.timers.forEach(clearTimeout); ctl.audioTimers.forEach(clearTimeout);
      climbCtl = null; if (ctl.onDone) ctl.onDone();
    }, 850);
    return;
  }
  function step() {
    if (idx < 0) {
      if (cur) { cur.classList.remove('cur', 'slam-in'); cur.classList.add('hero'); }
      ctl.timers.forEach(clearTimeout); ctl.audioTimers.forEach(clearTimeout);
      climbCtl = null; if (ctl.onDone) ctl.onDone();
      return;
    }
    const newP = plateNode(list[idx], kind, 'slam-in');
    st.insertBefore(newP, cur);
    climbT(ctl, () => {
      cur.classList.remove('cur'); cur.classList.add('zoom');
      sndWhack();
      climbAudio(ctl, () => tone(110, 0.10, 'square', 0.16), 30);
      climbT(ctl, () => {
        const stars = dizzyStars(cur);
        sndDizzy();
        climbT(ctl, () => {
          sndWhoops();
          cur.classList.remove('zoom'); cur.classList.add('knocked-fast');
          climbT(ctl, () => {
            stars.remove();
            if (cur.parentNode) cur.parentNode.removeChild(cur);
            cur = newP; newP.classList.remove('slam-in'); newP.classList.add('cur');
            idx--; step();
          }, 550);
        }, 1000);
      }, 280);
    }, 550);
  }
  climbT(ctl, step, 850);
}

/* 成绩列表合并：逐条 keepBest（同名同难度保最佳），返回合并条数。

function importDB(f, rerender) {
  if (!f) return;

         拓片按玩家合并（同名覆盖、他人保留——教室多学生轮流，导入不能清掉别人的收藏）；
         成绩列表 keepBest 合并（同名同难度保最佳），旧档导入不再回滚本机新成绩 */
      const impRub = migrateRubBy(d.rubBy, d.rubbings);
      const impSeen = migrateSeenBy(d.seenBy, d.rubTourSeenN);
      mergeRecords(DB.solo, d.solo, betterSolo);
      mergeRecords(DB.duo, d.duo, betterDuo);
      DB.roster = DB.roster || [];
      (d.roster || []).forEach(nm => { if (nm && DB.roster.indexOf(nm) < 0) DB.roster.push(nm); });
      DB.lib = d.lib || DB.lib || null;
      Object.keys(d.ach || {}).forEach(k => { if (d.ach[k]) DB.ach[k] = d.ach[k]; });   /* 成就=徽记旗标，取并集 */
      DB.rubTourSeenN = Math.max(DB.rubTourSeenN || 0, d.rubTourSeenN || 0);
      DB.rubBy = Object.assign({}, DB.rubBy || {}, impRub);
      DB.seenBy = Object.assign({}, DB.seenBy || {}, impSeen);
      DB.soloName = d.soloName || DB.soloName || '';   /* 旧版全机拓片自动迁入「我」名下；导入件缺省时保留本地上次参赛名字 */
      /* eggRec 按模式合并（dian.solo/duo 逐条 keepBest）——旧档导入绝不抹掉本机彩蛋成绩；
         eggSel 已撤出 DB（勾选=内存态，导入不涉及）。新增彩蛋模式若计分模型不同，需给 mergeRecords 配对应 better */
      const incEgg = (d.eggRec && typeof d.eggRec === 'object' && !Array.isArray(d.eggRec)) ? d.eggRec : null;
      if (incEgg) {
        DB.eggRec = DB.eggRec || {};
        Object.keys(incEgg).forEach(mid => {
          const dst = (DB.eggRec[mid] = DB.eggRec[mid] || {});
          ['solo', 'duo'].forEach(k => {
            const inc = incEgg[mid] && incEgg[mid][k];
            if (Array.isArray(inc)) { if (!Array.isArray(dst[k])) dst[k] = []; mergeRecords(dst[k], inc, betterDian); }
          });

      }
      lastTs = [];
      DIFF_ORDER.forEach(k => { DB.solo = dedupeList(DB.solo, k); DB.duo = dedupeList(DB.duo, k); });
      saveDB();   /* 导入后必须 saveDB（若调 loadDB 会被 localStorage 旧值覆盖回去） */
      toast('导入成功（合并保最佳）：单人 ' + DB.solo.length + ' 条 / 双人 ' + DB.duo.length + ' 条 / 拓片 ' + rubCountOf(curPlayer()) + ' 字');
      if (rerender) rerender();

  };

}
function clearScores(scope, rerender) {
  const label = scope === 'duo' ? '对决成绩' : '单人成绩';
  if (!confirm('确定清空' + label + '吗？此操作不可撤销（建议先导出备份）。拓片收集不受影响。')) return;
  DB[scope] = [];
  lastTs = []; saveDB();
  toast('已清空' + label);
  if (rerender) rerender();
}
/* 结算页成绩管理三件套绑定（solo/duo 页互斥渲染，无 id 冲突） */
function wireScoreMgmt(rerender, scope) {
  const be = $('btnExport'), bi = $('btnImport'), bc = $('btnClearScores'), bf = $('importFile');
  if (be) be.onclick = exportDB;
  if (bi) bi.onclick = () => bf && bf.click();
  if (bf) bf.onchange = () => { importDB(bf.files[0], rerender); bf.value = ''; };
  if (bc) bc.onclick = () => clearScores(scope || 'solo', rerender);
}

/* ---------- 拓片墙 · 榜单 ---------- */
let BOARD_TAB = 'rub';
let BOARD_DIFF = null;   /* 难度子榜当前档（null=未选，默认取第一档菜鸟）；2026-10-08 何何老师定稿：
                            菜鸟/困难/梦魇三档实力不可比（同一页混排不科学不公平），三档分列独立榜单页内切换 */
/* 榜单表格（拓片墙·榜单页与结算页内嵌共用同一渲染）：tab='solo'|'duo'，limit 截断条数；
   diffFilter='rookie'|'hard'|'nightmare' 只排该难度（结算页内嵌=本局难度；拓片墙=BOARD_DIFF 子榜）；
   本轮记录（lastTs，保存时写入）自动高亮 me 行 */
function boardTableHTML(tab, limit, diffFilter) {
  const isSolo = tab === 'solo';
  const src = isSolo ? DB.solo : DB.duo;
  const list = diffFilter ? src.filter(r => r.diff === diffFilter) : src;
  if (!list.length) return { html: `<div class="boardEmpty">还没有战绩 —— 先去${isSolo ? '铸铭' : '对决'}一局！</div>`, rows: 0 };
  const better = isSolo ? betterSolo : betterDuo;
  const sorted = list.slice().sort((x, y) => better(x, y) ? -1 : 1);
  const shown = dedupeByName(sorted, better).slice(0, limit);
  const medal = i => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
  const html = `<table class="rk"><tr>
      <th>#</th><th>史官</th>${isSolo ? '' : '<th>对手</th>'}
      <th>${isSolo ? '写铭总分' : 'PK总分'}</th><th>点亮拓片数</th><th>${isSolo ? '印章' : '胜负'}</th><th>日期</th></tr>
      ${shown.map((r, i) => {
        const me = (lastTs || []).indexOf(r.ts) >= 0;
        const wlab = isSolo ? r.marks : (r.win === 'W' ? '🏆 胜' : r.win === 'L' ? '负' : '平');
        return `<tr${me ? ' class="me"' : ''}><td>${medal(i)}</td><td>${esc(r.name)}</td>
        ${isSolo ? '' : '<td>' + esc(r.rival || '-') + '</td>'}
        <td><b>${isSolo ? r.traceTotal : r.score}</b></td>
        <td>${rubCountOf(r.name)}</td>
        <td>${wlab}</td>
        <td>${new Date(r.ts).toLocaleDateString()}</td></tr>`;
      }).join('')}</table>`;
  return { html, rows: shown.length };
}
/* 拓片墙榜单三件套（2026-10-11 何何老师定稿：每张榜单下方**常驻** 导入/导出/清空 ——
   不再只存在于结算页，退出对局、刷新、回封面后随时可备份/迁移/清理某一榜成绩）。
   导出/导入=全档成绩（与结算页同一套 exportDB/importDB，导入=合并保最佳绝不整替）；
   清空=仅本榜（单人/对决/点兵各自独立，拓片与其它榜不受影响）。
   拓片墙页签是收藏墙非排行榜，不设本行（拓片清空属危险操作且无既有函数，不做） */
const WALL_CLEAR_LABEL = { solo: '单人', duo: '对决', dian: '点兵' };
function wallMgmtHTML(tab) {
  return `<div class="resBtns" style="margin-top:12px">
    <button class="btn ghost sm" id="wallExport">⬇ 导出成绩</button>
    <button class="btn ghost sm" id="wallImport">⬆ 导入成绩</button>
    <button class="btn ghost sm" id="wallClear">🗑 清空${WALL_CLEAR_LABEL[tab] || ''}成绩</button>
    <input type="file" id="wallImportFile" accept=".json" style="display:none">
  </div>`;
}
function wireWallMgmt(tab) {
  const be = $('wallExport'), bi = $('wallImport'), bc = $('wallClear'), bf = $('wallImportFile');
  if (be) be.onclick = exportDB;
  if (bi) bi.onclick = () => bf && bf.click();
  if (bf) bf.onchange = () => { importDB(bf.files[0], () => renderBoard()); bf.value = ''; };
  if (!bc) return;
  bc.onclick = () => {
    if (tab === 'dian') {
      if (!confirm('确定清空点兵点将成绩吗？此操作不可撤销（建议先导出备份）。')) return;
      dianStore().solo = []; dianStore().duo = [];
      lastTs = []; saveDB(); toast('已清空点兵成绩'); renderBoard();
    } else {
      clearScores(tab, () => renderBoard());
    }
  };
}
function renderBoard() {
  const s = $('s9');
  const tabs = [['rub', '🏛️ 拓片墙'], ['solo', '📜 单人榜'], ['duo', '⚔️ 对决榜'], ['dian', '⛺ 点兵榜']];
  s.innerHTML = `
  <div class="wrap">
    <div class="h1">🏛️ 拓片墙 · 榜单</div>
    <div class="tabRow">${tabs.map(t => `<span class="chip ${BOARD_TAB === t[0] ? 'on' : ''}" data-tab="${t[0]}">${t[1]}</span>`).join('')}</div>
    <div id="boardBody"></div>
  </div>`;
  s.querySelectorAll('[data-tab]').forEach(c => c.onclick = () => { BOARD_TAB = c.dataset.tab; BOARD_DIFF = null; renderBoard(); });
  const body = $('boardBody');
  if (BOARD_TAB === 'rub') {
    const player = curPlayer();   /* 拓片墙=当前玩家的收藏（2026-10-06 按玩家归属） */
    const rubs = rubMapOf(player);
    const nRub = CHARS.filter(c => rubs[c]).length;
    body.innerHTML = `
      <div class="progLine"><span>已拓</span><div class="bar"><i style="width:${(nRub / CHARS.length * 100).toFixed(1)}%"></i></div><span><b>${nRub}</b> / ${CHARS.length}</span></div>
      <div class="rubGrid">${CHARS.map(ch => {
        const sc = rubs[ch], info = DZINFO[ch];
        return sc
          ? `<div class="rubCard"><div class="glyph">${svgOf(ch)}</div><div class="kai">${esc(ch)} · ${sc} 分</div><div class="sw">${esc(info.sw)}</div></div>`
          : `<div class="rubCard empty"><div class="glyph" style="font-family:'STKaiti','Kaiti SC',KaiTi,serif;font-size:40px;color:#776c5b;padding:12px 0">${esc(ch)}</div><div class="kai">待铸 · ${'一二三'[info.lv - 1]}阶</div><div class="sw">在写铭中拿 ${CAST_PASS} 分即拓</div></div>`;
      }).join('')}</div>`;
    if (nRub > (DB.seenBy[player] || 0)) {   /* 复用本分支已算好的 nRub（该玩家已拓数）；巡游已展示数也按玩家记 */
      DB.seenBy[player] = nRub; saveDB();   /* 有未展示过的已解锁字 ⇒ 进入即巡游（切走切回不重播） */
      /* 巡游序列：按行（offsetTop 分组）升序、行内从左到右、只含已拓卡 ⇒ 空行自然跳过；
         节奏（何何老师 2026-10-06 定稿）：每行总时长 1 秒，行内均分快闪（1000/行内张数/张） */
      const cards = [...body.querySelectorAll('.rubCard:not(.empty)')];
      const rows = new Map();
      cards.forEach(c => {
        const top = Math.round(c.offsetTop);
        if (!rows.has(top)) rows.set(top, []);
        rows.get(top).push(c);
      });
      const seq = [...rows.keys()].sort((a, b) => a - b)
        .flatMap(top => {
          const row = rows.get(top).sort((x, y) => x.offsetLeft - y.offsetLeft);
          const ms = Math.round(1000 / row.length);
          return row.map(c => ({ c, ms }));
        });
      startRubTour(seq);
    }
  } else if (BOARD_TAB === 'dian') {
    /* 点兵榜同样按难度分档（V3.2 三档轮数/满分不同，混排不公平；旧档无 diff → 菜鸟档） */
    const dKey = BOARD_DIFF && DIAN_TIERS[BOARD_DIFF] ? BOARD_DIFF : DIFF_ORDER[0];
    body.innerHTML = `
      <div class="diffTabs">${DIFF_ORDER.map(k => `<span class="chip ${k === dKey ? 'on' : ''}" data-diff="${k}">${DIAN_TIERS[k].icon} ${DIAN_TIERS[k].label}</span>`).join('')}</div>
      <div class="sub" style="text-align:center;margin:2px 0 10px">${DIAN_TIERS[dKey].icon} ${DIAN_TIERS[dKey].label}档点兵榜 —— 各难度独立排名（三档轮数与满分不同）</div>
      ${dianBoardHTML(12, dKey).html}${wallMgmtHTML('dian')}`;
    body.querySelectorAll('[data-diff]').forEach(c => c.onclick = () => { BOARD_DIFF = c.dataset.diff; renderBoard(); });
    wireWallMgmt('dian');
  } else {
    /* 难度子榜（2026-10-08 何何老师定稿）：菜鸟/困难/梦魇三档实力不可比，分列独立榜单页内切换；
       档位从 DIFF_ORDER 动态生成（不写死三档），子榜标题带该档图标与名 */
    const dKey = BOARD_DIFF && DIFF_ORDER.indexOf(BOARD_DIFF) >= 0 ? BOARD_DIFF : DIFF_ORDER[0];
    const dInfo = DIFF[dKey];
    body.innerHTML = `
      <div class="diffTabs">${DIFF_ORDER.map(k => `<span class="chip ${k === dKey ? 'on' : ''}" data-diff="${k}">${DIFF[k].icon} ${DIFF[k].name}</span>`).join('')}</div>
      <div class="sub" style="text-align:center;margin:2px 0 10px">${dInfo.icon} ${dInfo.name}榜 —— 各难度独立排名（三档实力不可比）</div>
      ${boardTableHTML(BOARD_TAB, 12, dKey).html}${wallMgmtHTML(BOARD_TAB)}`;
    body.querySelectorAll('[data-diff]').forEach(c => c.onclick = () => { BOARD_DIFF = c.dataset.diff; renderBoard(); });
    wireWallMgmt(BOARD_TAB);
  }
}

/* 拓片墙金框巡游：每行总时长 1 秒（行内均分，脉冲动画时长随槽位压缩=快闪），
   依次点亮下一张（later 注册进 TIMERS，离屏自动清理）；
   卡片被重建/离屏时立即终止（body.contains 守卫）；播完平滑滚回墙顶 */
function startRubTour(seq) {
  let i = 0;
  const step = () => {
    if (i >= seq.length) {
      const grid = document.querySelector('#boardBody .rubGrid');
      if (!grid || !document.body.contains(grid)) return;   /* 页面已切走：连收束一起放弃 */
      const s9 = document.getElementById('s9');
      s9.classList.remove('wallFinale');
      void s9.offsetWidth;                                  /* 强制 reflow：同页二巡游也能重播 */
      s9.classList.add('wallFinale');                       /* 收束：整页+金边框同闪 1s（仿铸鼎 dingFlash） */
      later(() => {
        s9.classList.remove('wallFinale');
        if (document.body.contains(grid)) grid.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }, 1000);
      return;
    }
    const { c, ms } = seq[i];
    if (!document.body.contains(c)) return;   /* 页面已切走/重建：巡游终止 */
    c.style.animationDuration = ms + 'ms';    /* 脉冲压缩进槽位：快闪但完整走完 */
    c.classList.add('tour');
    if (c.scrollIntoView) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    later(() => { c.classList.remove('tour'); c.style.animationDuration = ''; i++; step(); }, ms);
  };
  step();
}

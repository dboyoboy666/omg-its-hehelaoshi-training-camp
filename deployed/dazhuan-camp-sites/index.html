:root{
  --ink:#16324f; --ink-soft:#3f5f8a; --muted:#5b7ba6;
  --blue:#3b82f6; --blue-deep:#2563eb; --indigo:#4f46e5;
  /* 图1 底图自然高度（1918:856，2026-10-14 高清版），用于背景缝合对齐 */
  --art-h: calc(100vw * 856 / 1918);
  --seam-up: 170px;    /* 缝合层从底图底边上方多少 px 开始淡入 */
  --seam-fade: 200px;  /* 淡入完成距离 */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  color:var(--ink);
  /* 底色 = 图1 底部水色的水平渐变（左#96BDFB → 中#9ABFFC → 右#85B3F5），
     上叠一层自页面中部才开始的纵向加深：顶部保持与原画水色一致，
     向下逐渐衍展为更深的水色，与模糊缝合层无缝衔接 */
  background-image:
    linear-gradient(180deg, rgba(30,64,150,0) 0%, rgba(30,64,150,0) 38%, rgba(30,64,150,.07) 64%, rgba(30,64,150,.18) 84%, rgba(30,64,150,.30) 100%),
    linear-gradient(90deg, #96BDFB 0%, #9ABFFC 50%, #85B3F5 100%);
  min-height:100vh;
  overflow-x:hidden;
}

/* ==================== 背景层：插画 + 模糊缝合 + 伪3D 涟漪 ==================== */
.bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
/* 图1 原画：贴顶全宽，保持原比例 */
.bgArt{
  position:absolute; left:0; top:0; width:100%; height:var(--art-h);
  background:url('bg.jpg') center center / 100% 100% no-repeat;
}
/* 模糊缝合层：与原画逐像素对齐的模糊副本，从原画底边上方 --seam-up 处
   淡入到完全模糊，再凭借模糊外扩自然溶入底色——消除上下硬边界，
   实现「模糊淡入淡出」式衔接；画面下半部分由底色渐变 + 全屏涟漪延续 */
.bgSeam{
  position:absolute; left:0; right:0; top:calc(var(--art-h) - var(--seam-up)); bottom:0;
  background:url('bg.jpg') center calc(var(--seam-up) - var(--art-h)) / 100% auto no-repeat;
  filter:blur(20px) saturate(1.05);
  -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 var(--seam-fade));
          mask-image:linear-gradient(180deg, transparent 0, #000 var(--seam-fade));
}
/* ---- 伪 3D 动态涟漪：若干中心点各自向外缓缓荡漾 ----
   视觉原理：①柔和的径向渐变环（非细线）；②椭圆压扁（scaleY .66→.30），
   模拟斜视角下的水面圆环；③越扩张越淡（能量衰减）；④中心点微光呼吸；
   ⑤环径随扩张增大、模糊感增强，形成带 Z 轴的纵深远近。 */
.ripples{position:absolute; inset:0; overflow:hidden;}
.rp{
  position:absolute; left:var(--x); top:var(--y);
  width:var(--w); height:var(--w); border-radius:50%;
  transform:translate(-50%,-50%) scale(.04);
  opacity:0;
  background:radial-gradient(closest-side,
    rgba(255,255,255,0) 54%,
    rgba(255,255,255,.05) 63%,
    rgba(255,255,255,var(--o,.4)) 73%,
    rgba(255,255,255,.10) 83%,
    rgba(255,255,255,0) 95%);
  filter:blur(var(--b,6px));
  animation:rp3d var(--dur,10s) cubic-bezier(.25,.6,.35,1) var(--d,0s) infinite;
  will-change:transform,opacity;
}
@keyframes rp3d{
  0%{transform:translate(-50%,-50%) scale(.04) scaleY(.66); opacity:0;}
  12%{opacity:1;}
  55%{opacity:.7;}
  100%{transform:translate(-50%,-50%) scale(1) scaleY(.3); opacity:0;}
}
/* 中心点微光：光源在涟漪中心的水面反光 */
.rpCore{
  position:absolute; left:var(--x); top:var(--y);
  width:calc(var(--w) * .22); height:calc(var(--w) * .22); border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(255,255,255,.30), rgba(255,255,255,.09) 55%, rgba(255,255,255,0) 78%);
  filter:blur(5px);
  animation:corePulse 5.6s ease-in-out var(--d,0s) infinite;
}
@keyframes corePulse{
  0%,100%{opacity:.5; transform:translate(-50%,-50%) scale(1);}
  50%{opacity:.85; transform:translate(-50%,-50%) scale(1.14);}
}
/* 猫形遮挡层：与底图逐像素对齐的猫身切图（RGBA，猫形以外全透明），
   覆盖在涟漪层之上——猫体遮挡涟漪（物理正确：水面涟漪被猫身挡住），
   只显示未被遮挡的部分；切图 RGB 取底图原像素，视觉上与底图零差异 */
.bgCat{
  position:absolute; left:0; top:0; width:100%; height:var(--art-h);
  background:url('cat-cut.png') center center / 100% 100% no-repeat;
}

/* ==================== 内容舞台（grid 居中，内容超高时不被裁切） ==================== */
.stage{
  position:relative; z-index:1; min-height:100vh;
  display:grid; justify-items:center; align-content:center;
  gap:clamp(18px,3.2vh,32px);
  padding:clamp(22px,4.5vh,52px) 16px;
}

/* ---- 标题区（毛玻璃云朵，保证渐变文字在任何背景上都清晰） ---- */
.headBlock{
  display:inline-block; text-align:left;
  background:rgba(255,255,255,.40);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.6); border-radius:22px;
  box-shadow:0 18px 50px rgba(21,60,120,.16);
  /* 垂直内边距下限 20px：为「浦外」角标预留随大标题一同上浮的行程空间
     （角标浮动顶点须始终收在白框内沿之内；vh≥909px 时取值不变，仅较矮视口略增头部空间） */
  padding:clamp(20px,2.2vh,22px) clamp(12px,2.2vw,30px);
}
/* 大标题：小学生手写字体 + 紫渐变（图2色调）+ 高光扫过 + 动态渐变 + 微浮动 */
.title{
  position:relative; /* 角标定位基准（2026-10-15 晚改版：角标改为 .title 直接子元素，不随单字浮动） */
  font-family:'XiaoXueShengShouXie',"Hannotate SC","Xingkai SC","Kaiti SC",KaiTi,STKaiti,serif;
  font-size:clamp(24px,6.6vw,66px); font-weight:400;
  white-space:nowrap; letter-spacing:.04em; line-height:1.32;
  padding:0 8px; /* 容纳浮动位移，避免裁切 */
}
.title > span{
  display:inline-block;
  background-image:
    linear-gradient(100deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.92) 50%, rgba(255,255,255,0) 58%),
    linear-gradient(115deg, #F3E8FF 0%, #C084FC 20%, #A855F7 42%, #7C3AED 62%, #6D28D9 80%, #C084FC 100%);
  background-size:300% 100%, 220% 220%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
  animation:titleFloat 10.4s ease-in-out infinite, titleSheen 6.5s ease-in-out infinite;
}
@keyframes titleFloat{
  0%,100%{transform:translate(0,0);}
  25%{transform:translate(2px,-6px);}
  50%{transform:translate(0,-10px);}
  75%{transform:translate(-2px,-6px);}
}
@keyframes titleSheen{
  0%,100%{background-position:100% 50%, 0% 45%;}
  50%{background-position:0% 50%, 100% 55%;}
}
/* 「浦外」角标：悬于「师」「多」二字正上方（2026-10-15 新增，当晚三轮改版；
   2026-10-16 下午修复：今早提交误改为「锚定师字右上角」且未随标题字体更换重测墨迹
   常数，导致角标压字——本块恢复二字间隙居中定位，常数已按新字体重测，见 placeBadge）
   - 字号 = 大标题的 2/9（.22em：在 1/3 基础上再缩 1/3，相对父级字号，随 clamp 自适应）
   - 外框 = 滚动标语同款橙渐变 + 高光流光（双图层 + titleSheen，颜色与特效全同标语）
   - 框内填充 = 导航页背景图同款水色渐变（运行时 JS 采样当前底图，见 sampleBadgeFill）
   - 框内字 = 标语橙渐变 + 高光扫过（不滚动）；框内字字体 = NavBadgeHei（2026-10-16 起）
   - 浮动 = 与大标题同一套 titleFloat（同曲线/同时长 10.4s，只上浮不下沉），
     延迟取「师」「多」二字波浪相位的正中（JS 设 1.12s / 1.575s），随波浪一同起伏
   - 定位（placeBadge 运行时精确设置，此处仅为兜底）：
     水平居中于「师」「多」墨迹间隙中点；垂直布局位 = 白框内沿 + 上浮行程(10px)
     + 2px——浮动顶点仍收在框内一丝；与二字墨迹同相浮动，相对间隙恒定（≥3px） */
.title > span{position:relative;}   /* 保留：span 层叠基准（角标已移出单字，不再依赖） */
.titleBadge{
  position:absolute; left:50%; top:-8px; z-index:2; font-family:'NavBadgeHei',"HYQiHei","PingFang SC",sans-serif;
  font-size:.22em; line-height:1; font-weight:800; letter-spacing:.05em;
  padding:.12em; border-radius:.44em; pointer-events:none;
  background-image:
    linear-gradient(100deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.85) 50%, rgba(255,255,255,0) 58%),
    linear-gradient(115deg, #FFE8CC 0%, #FDBA74 20%, #FB923C 42%, #F97316 60%, #EA580C 78%, #FDBA74 100%);
  background-size:300% 100%, 220% 220%;
  animation:titleFloat 10.4s ease-in-out infinite, titleSheen 6.5s ease-in-out infinite;
}
.titleBadge i{
  display:block; font-style:normal;
  padding:.08em .22em .13em; border-radius:.32em;
  /* 兜底填充 = 图1 标题区水色竖向渐变；运行时被 sampleBadgeFill 的采样结果覆盖 */
  background-image:linear-gradient(180deg,#bcd9f7 0%,#a5cdf2 55%,#8dbdee 100%);
}
.titleBadge i span{
  display:block;
  background-image:
    linear-gradient(100deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.85) 50%, rgba(255,255,255,0) 58%),
    linear-gradient(115deg, #FFE8CC 0%, #FDBA74 20%, #FB923C 42%, #F97316 60%, #EA580C 78%, #FDBA74 100%);
  background-size:300% 100%, 220% 220%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
  animation:titleSheen 6.5s ease-in-out infinite;
}

/* 第二行：环绕接力式播送带（复刻课件「何何老师@PFLS」滚动规则，反向播放）——
   结构复刻课件封面：orbitRun 宽 200%，每副本宽 50%（= 一整带宽），
   整体 translateX(0→-50%) 平移一幅循环（文字向左游走，新文案从右侧进入）；
   带内可见量恒等于一份完整文案（主体 + 绕回的尾巴左右相加），
   结构上不可能同屏出现第二份、也不会把句子切断在带外。
   字号由 JS 按实测带宽收紧（完整句子一趟可见），两侧 2.5% 渐隐遮罩兜底边缘；
   时长 = 带宽÷28.4px/s（JS 按实时带宽重算）。 */
.orbit{
  position:relative; width:100%; height:2.3em;
  margin-top:clamp(8px,1.4vh,14px);
  overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 2.5%, #000 97.5%, transparent 100%);
          mask-image:linear-gradient(90deg, transparent 0, #000 2.5%, #000 97.5%, transparent 100%);
}
.orbitRun{
  position:absolute; left:0; top:.24em;
  width:200%; display:inline-flex; white-space:nowrap;
  font-size:clamp(12px,1.7vw,16px); font-weight:800; letter-spacing:.05em; line-height:1.6;
  will-change:transform;
  animation:orbitSweep 30s linear infinite; /* 默认值，JS 按带宽重算 */
}
.orbitRun .oc{
  flex:none; width:50%; text-align:center; /* 每副本 = 一整带宽；文本居中使两缘对称（边距=3.5%带宽 > 遮罩淡区2.5%，任何视口句首句尾均不侵入淡区） */
  background-image:
    linear-gradient(100deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.85) 50%, rgba(255,255,255,0) 58%),
    linear-gradient(115deg, #FFE8CC 0%, #FDBA74 20%, #FB923C 42%, #F97316 60%, #EA580C 78%, #FDBA74 100%);
  background-size:300% 100%, 220% 220%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
  animation:ocFloat 10.4s ease-in-out infinite, titleSheen 6.5s ease-in-out infinite;
}
@keyframes ocFloat{
  0%,100%{transform:translate(0,0);}
  30%{transform:translate(2px,-4px);}
  65%{transform:translate(-2px,-6px);}
}
@keyframes orbitSweep{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ==================== 课件卡片槽位 ==================== */
.cards{
  display:flex; flex-wrap:wrap; justify-content:center;
  gap:clamp(12px,1.6vw,18px);
  width:min(1160px,94vw);
}
.card{
  position:relative; overflow:hidden;
  width:clamp(146px,15.2vw,184px); min-height:214px;
  border-radius:20px;
  background:rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.78);
  box-shadow:0 10px 28px rgba(21,60,120,.18);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:9px; padding:22px 14px 18px;
  cursor:pointer; user-select:none; touch-action:manipulation;
  transition:transform .28s cubic-bezier(.22,1.2,.36,1), box-shadow .28s, border-color .28s;
}
/* 动态渐变底层：仿大标题的流动渐变（半透明紫）。
   渐变在图层内部滑动（background-position 驱动）而非整层平移——
   图层恒等于卡片尺寸，任何时刻都完整覆盖，杜绝左右漂移露底。 */
.card::before{
  content:""; position:absolute; inset:0; z-index:0;
  background:linear-gradient(115deg,
    rgba(237,233,254,.66) 0%, rgba(196,181,253,.56) 22%, rgba(167,139,250,.50) 45%,
    rgba(99,102,241,.46) 68%, rgba(165,180,252,.60) 100%);
  background-size:200% 100%;
  animation:cardFlow 8.5s ease-in-out infinite alternate;
}
@keyframes cardFlow{from{background-position:0% 50%;}to{background-position:100% 50%;}}
/* 悬停提亮层 */
.card::after{
  content:""; position:absolute; inset:0; z-index:0; border-radius:inherit;
  background:linear-gradient(160deg, rgba(255,255,255,.42), rgba(255,255,255,.05) 60%);
  opacity:0; transition:opacity .28s; pointer-events:none;
}
.card:hover::after{opacity:1;}
.card > *{position:relative; z-index:1;}
.card:hover{
  transform:translateY(-9px) scale(1.035);
  box-shadow:0 22px 44px rgba(21,60,120,.28);
}
.card:active{transform:translateY(-4px) scale(.99);}
.card .icon{
  width:58px; height:58px; border-radius:16px;
  display:grid; place-items:center;
  font-family:"STKaiti","Kaiti SC",KaiTi,serif; font-size:30px; font-weight:700; color:#fff;
  background:linear-gradient(135deg,#7CB3F5,#3B82F6 55%,#4F46E5);
  box-shadow:0 8px 18px rgba(59,130,246,.40), inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .28s;
}
.card:hover .icon{animation:iconPop .6s ease;}
@keyframes iconPop{
  0%,100%{transform:translateY(0) scale(1);}
  35%{transform:translateY(-7px) scale(1.09);}
  70%{transform:translateY(2px) scale(.98);}
}
.card .c-title{font-size:16px; font-weight:800; color:var(--ink); line-height:1.35; text-align:center;}
.card .c-sub{font-size:12px; color:var(--muted); text-align:center; letter-spacing:.5px;}
.card .cta{font-size:12px; font-weight:700; color:var(--blue-deep); margin-top:2px; letter-spacing:1px;}
.card .cta i{font-style:normal; display:inline-block; transition:transform .28s;}
.card:hover .cta i{transform:translateX(4px);}
/* 高光一扫而过（悬停时保留） */
.card .shine{position:absolute; inset:0; border-radius:inherit; overflow:hidden; pointer-events:none; z-index:1;}
.card .shine::after{
  content:""; position:absolute; top:-60%; left:-130%; width:58%; height:220%;
  transform:rotate(18deg);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  transition:left .7s ease;
}
.card:hover .shine::after{left:135%;}
/* 置顶徽标 */
.pin{
  position:absolute; top:10px; right:10px; z-index:2;
  font-size:11px; font-weight:700; color:#fff; letter-spacing:2px;
  background:linear-gradient(90deg,#FB923C,#EA580C);
  padding:3px 9px 3px 11px; border-radius:999px;
  box-shadow:0 4px 10px rgba(249,115,22,.35);
}
/* 预留空槽：同款动态渐变（更透一些）+ 虚线边 */
.card.slot{border:2px dashed rgba(99,102,241,.5); box-shadow:none;}
.card.slot::before{
  background:linear-gradient(115deg,
    rgba(237,233,254,.42) 0%, rgba(196,181,253,.36) 22%, rgba(167,139,250,.32) 45%,
    rgba(99,102,241,.30) 68%, rgba(165,180,252,.40) 100%);
  background-size:200% 100%;
}
.card.slot:hover{border-color:rgba(99,102,241,.8);}
.card.slot .icon{
  background:rgba(59,130,246,.12); color:var(--blue);
  box-shadow:none; font-size:26px; font-weight:300;
}
.card.slot .c-title{color:var(--ink-soft);}
/* 添加课件位（最后一格的功能位）：橙色系动态渐变 + 虚线边 */
.card.add{border:2px dashed rgba(249,115,22,.55);}
.card.add::before{
  background:linear-gradient(115deg,
    rgba(255,237,213,.48) 0%, rgba(253,186,116,.40) 30%, rgba(251,146,60,.34) 60%,
    rgba(255,237,213,.46) 100%);
  background-size:200% 100%;
}
.card.add:hover{border-color:rgba(249,115,22,.85);}
.card.add .icon{
  background:rgba(249,115,22,.14); color:#EA580C;
  box-shadow:none; font-size:28px; font-weight:400;
}
.card.add .c-title{color:#9a3412;}
.card.add .c-sub{color:#c2410c;}
/* 超出 10 个同屏上限时折叠隐藏 */
.card.is-hidden{display:none;}
/* 拖动态效 */
.card.dragging{opacity:.45; transform:scale(1.05) rotate(1.5deg); cursor:grabbing;}
.card.dropzone{outline:3px dashed rgba(249,115,22,.85); outline-offset:3px; transform:translateY(-6px) scale(1.02);}

/* ---- 「更多课件」折叠按钮（小巧） ---- */
.moreBtn{
  display:none;
  font-family:inherit; font-size:clamp(12px,1.1vw,13.5px); font-weight:700; letter-spacing:1px;
  color:#fff; cursor:pointer;
  padding:9px 22px; border-radius:999px; border:1px solid rgba(255,255,255,.5);
  background:linear-gradient(95deg,#7C3AED,#6366F1 55%,#3B82F6);
  background-size:200% 100%;
  box-shadow:0 8px 20px rgba(79,70,229,.30);
  transition:transform .25s, box-shadow .25s;
  animation:btnFlow 7s ease-in-out infinite alternate;
}
@keyframes btnFlow{from{background-position:0% 50%;}to{background-position:100% 50%;}}
.moreBtn:hover{transform:translateY(-2px); box-shadow:0 12px 26px rgba(79,70,229,.38);}
.moreBtn .chev{display:inline-block; margin-left:6px; transition:transform .25s;}
.moreBtn.open .chev{transform:rotate(180deg);}

/* ---- 底部：版权 ---- */
.copyright{
  font-size:clamp(11px,1.05vw,13px); color:var(--ink-soft); letter-spacing:.6px;
  background:rgba(255,255,255,.48); padding:8px 20px; border-radius:999px;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.6);
}

/* ---- 轻提示 ---- */
.toast{
  position:fixed; left:50%; bottom:36px; transform:translate(-50%,16px);
  background:rgba(22,50,79,.92); color:#fff;
  padding:10px 22px; border-radius:999px; font-size:14px; letter-spacing:1px;
  opacity:0; transition:.32s ease; z-index:50; pointer-events:none;
  box-shadow:0 10px 26px rgba(0,0,0,.26);
}
.toast.show{opacity:1; transform:translate(-50%,0);}

/* ==================== 背景切换器：右上角小按钮 + 密钥解锁菜单 ==================== */
#bgBtn{
  position:fixed; top:18px; right:18px; z-index:1200;
  width:38px; height:38px; padding:0;
  display:flex; align-items:center; justify-content:center;
  border:1.5px solid rgba(255,255,255,.65);
  border-radius:999px;
  background:rgba(255,255,255,.42);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 4px 18px rgba(22,50,79,.14);
  color:var(--ink); font-size:13px; font-weight:700; letter-spacing:.06em;
  cursor:pointer; transition:transform .25s, box-shadow .25s, background .25s;
}
#bgBtn:hover{transform:translateY(-2px); background:rgba(255,255,255,.62); box-shadow:0 8px 24px rgba(22,50,79,.2);}
#bgBtn .bgBtnIcon{font-size:17px; line-height:1;}
#bgPanel{
  position:fixed; top:64px; right:18px; z-index:1200; width:288px;
  border:1.5px solid rgba(255,255,255,.78); border-radius:16px;
  /* 面板底色 = 功能卡同款渐变紫（动态流动，复刻 cardFlow 节奏）——2026-10-15 去白底 */
  background:linear-gradient(115deg,
    rgba(237,233,254,.66) 0%, rgba(196,181,253,.56) 22%, rgba(167,139,250,.50) 45%,
    rgba(99,102,241,.46) 68%, rgba(165,180,252,.60) 100%);
  background-size:200% 100%;
  animation:cardFlow 8.5s ease-in-out infinite alternate;
  -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 14px 44px rgba(22,50,79,.22);
  padding:14px; display:none;
  max-height:calc(100vh - 84px); overflow-y:auto; /* 特效项增多后面板不自爆视口 */
}
#bgPanel.open{display:block; animation:bgPanelIn .28s ease;}
@keyframes bgPanelIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:none;}}
#bgPanel h3{font-size:14px; color:var(--ink); margin-bottom:10px; letter-spacing:.04em;}
#bgLockRow{display:flex; align-items:center; gap:10px;}
/* 密钥框 + 解锁按钮：与课件「何何老师@PFLS」彩蛋口令窗（图2）完全一致风格
   （深底 rgba(20,16,10,.92) / 2px 金框 #c9a227 / 金字 #e8c96a / 楷体 / 宽字距居中 /
    focus 金晕 / 错钥抖+红框 #b03a2e；按钮为 46×46 圆角方钮，内为向右箭头 ➜）
   源：趣味游戏互动HTML课件集/…-V3.2.html 第 484-495 行 #eggIn/#eggGo */
#bgPwd{
  flex:1; min-width:0; box-sizing:border-box;
  padding:11px 12px; font-size:17px; font-weight:700; letter-spacing:.3em; text-align:center;
  border:2px solid #c9a227; border-radius:14px; outline:none;
  background:rgba(20,16,10,.92); color:#e8c96a;
  font-family:"STKaiti","Kaiti SC",KaiTi,serif;
  transition:box-shadow .2s;

#bgPwd:focus{box-shadow:0 0 0 3px rgba(232,201,106,.22);}
#bgPwd.bad{border-color:#b03a2e; animation:bgShake .38s;}
@keyframes bgShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#bgUnlock{
  flex:none; width:46px; height:46px; padding:0;

  font-family:"STKaiti","Kaiti SC",KaiTi,serif;

#bgUnlock:hover{background:rgba(201,162,39,.22);}
#bgUnlock:disabled{opacity:.55; cursor:default;}
#bgErr{height:16px; margin-top:6px; font-size:11.5px; font-weight:600; color:#b03a2e;}
#bgList{margin-top:10px; display:none; flex-direction:column; gap:7px;}
#bgList.on{display:flex;}
.bgItem{

.bgItem:hover{border-color:var(--blue); background:rgba(255,255,255,.85);}
.bgItem.active{border-color:var(--blue-deep); background:rgba(59,130,246,.12);}
.bgItem .bgThumb{

}
.bgItem .bgName{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:12.5px; color:var(--ink); font-weight:600; letter-spacing:.02em;}
.bgItem .bgDel{

  background:rgba(220,38,38,.1); color:#dc2626; font-size:12px; line-height:1;
}
.bgItem .bgDel:hover{background:rgba(220,38,38,.22);}
#bgOps{margin-top:11px; padding-top:11px; border-top:1px dashed rgba(59,130,246,.3); display:none;}
#bgOps.on{display:block;}
#bgImportBtn{
  width:100%; padding:8px 0; font-size:12.5px; font-weight:700; letter-spacing:.08em;
  color:var(--blue-deep); background:rgba(59,130,246,.1);
  border:1.5px dashed rgba(59,130,246,.45); border-radius:9px; cursor:pointer;

#bgStretchRow{

  font-size:12.5px; color:var(--ink); cursor:pointer; user-select:none;

<script>
(function(){
  "use strict";

  /* ---------- 大标题：逐字拆分 + 波浪式延迟 ---------- */
  var title = document.getElementById('mainTitle');
  var text = (title.textContent || '').trim();
  title.textContent = '';
  Array.prototype.forEach.call(text, function(ch, i){
    var s = document.createElement('span');
    s.textContent = ch;
    s.style.animationDelay = (i * 0.32) + 's, ' + (i * 0.45) + 's';
    title.appendChild(s);
  });

  /* 「浦外」角标：悬于「师」「多」二字正上方。字号=大标题 2/9；外框=标语橙渐变流光；
     框内填充=背景图水色（JS 采样），框内字=标语橙渐变（不滚动）。三层结构：
     .titleBadge=框 / i=填充 / i>span=字（渐变裁字须独占元素）。
     角标文字用独立字体 NavBadgeHei（汉仪旗黑），与标题手写体分离；
     浮动延迟 = 「师」(0.96s/1.35s) 与「多」(1.28s/1.8s) 波浪相位的正中 1.12s/1.575s，
     与二字同相浮动。2026-10-16 下午修复：恢复间隙居中定位（今早曾被误改为师字右上角）。 */
  var shiSpan = null;
  Array.prototype.forEach.call(title.children, function(s){
    if(!shiSpan && s.textContent === '师') shiSpan = s;
  });
  if(shiSpan){
    var badge = document.createElement('b');
    badge.className = 'titleBadge';
    badge.innerHTML = '<i><span>浦外</span></i>';
    badge.style.animationDelay = '1.12s, 1.575s';  /* 师/多波浪相位正中：与二字同相起伏 */
    title.appendChild(badge);
  }

  /* 角标定位（placeBadge）：
     水平中心 = 「师」墨迹右缘 与「多」墨迹左缘 的中点（二字正中间）；
     垂直布局位 = headBlock 白框内沿 + 上浮行程(10px) + 2px——角标与大标题同相浮动
     （titleFloat 只上浮不下沉），浮动顶点仍收在框内一丝，不压框线；
     防压字：角标与二字墨迹同相浮动（延迟取相位正中，漂移 ≤0.5px），相对几何恒定，
     底边 ≤ 两字覆盖区最高墨迹顶（含「多」字左上撇，span 内 y17）− 间隙(3px) 即可，
     若仍会导致压字则自动让位（优先不压字）。
     墨迹常数 = 66px 字号像素实测折算的 em 比例（同一手写子集字体，随 clamp 自适应）。
     2026-10-16 下午：标题字体更换后按新字体重测（Chrome 无头渲染 + 像素扫描；
     旧字体常数复现校验通过——多左缘 0.227 / 多顶 0.258 与旧值分毫不差）——
       师右缘 0.924 → 0.955（span 内 x63/66）；师顶 0.500 → 0.242（span 内 y16/66）；
       多左缘 0.227（span 内 x15/66，不变）；  多顶 0.258（span 内 y17/66，不变）。 */
  function placeBadge(){
    var badge = document.querySelector('.titleBadge');
    if(!badge) return;
    var spans = title.querySelectorAll(':scope > span');
    var shi = null, duo = null;
    Array.prototype.forEach.call(spans, function(s){
      if(s.textContent === '师') shi = s;
      else if(s.textContent === '多') duo = s;
    });
    if(!shi || !duo) return;
    var fs = parseFloat(getComputedStyle(shi).fontSize);
    var INK_RIGHT_SHI = 0.955 * fs;  /* 师墨迹右缘（新字体实测：span 内 x63/66） */
    var INK_LEFT_DUO  = 0.227 * fs;  /* 多墨迹左缘（span 内 x15/66；新旧字体一致） */
    var INK_TOP_SHI   = 0.242 * fs;  /* 师字覆盖区最高墨迹顶（新字体实测：span 内 y16/66） */
    var INK_TOP_DUO   = 0.258 * fs;  /* 多字覆盖区最高墨迹顶（span 内 y17/66，左上撇；新旧一致） */
    var FLOAT_UP  = 10;              /* titleFloat 上浮行程（角标与大字同相浮动，只上不下） */
    var FRAME_GAP = 2;               /* 角标浮动顶点距白框内沿的呼吸（贴框一丝，不压框线） */
    var INK_GAP   = 3;               /* 角标底与墨迹顶的间隙（同相浮动，相对几何恒定） */
    var cx = ((shi.offsetLeft + INK_RIGHT_SHI) + (duo.offsetLeft + INK_LEFT_DUO)) / 2;
    var hb = document.querySelector('.headBlock');
    var titleRect = title.getBoundingClientRect();
    var top;
    if(hb){
      var hbBorder = parseFloat(getComputedStyle(hb).borderTopWidth) || 1;
      top = (hb.getBoundingClientRect().top + hbBorder + FLOAT_UP + FRAME_GAP) - titleRect.top;
    }else{
      top = -8;
    }
    badge.style.top = top + 'px';
    var bw = badge.offsetWidth, bh = badge.offsetHeight;
    badge.style.left = (cx - bw / 2) + 'px';
    /* 防压字校验：任何相位底边不得侵入两字覆盖区最高墨迹（取师/多较小者）。
       角标与字同相浮动 ⇒ 无需再预留浮动行程，仅留 3px 间隙（含邻字 0.32s 相位差漂移） */
    var inkTop = Math.min(titleRect.top + shi.offsetTop + INK_TOP_SHI,
                          titleRect.top + duo.offsetTop + INK_TOP_DUO);
    var limit  = inkTop - INK_GAP;
    var bottom = titleRect.top + top + bh;
    if(bottom > limit){
      top = limit - titleRect.top - bh;
      badge.style.top = top + 'px';
    }
  }
  placeBadge();
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(placeBadge); }
  var rzBadgePos = null;
  window.addEventListener('resize', function(){
    if(rzBadgePos) clearTimeout(rzBadgePos);
    rzBadgePos = setTimeout(placeBadge, 180);
  });

  /* ---------- 播送带：字号按带宽收紧（完整句子一趟可见）+ 时长按 28.4px/s ---------- */
  var orbitBox = document.querySelector('.orbit');
  var run = document.getElementById('orbitRun');
  function fitOrbit(){
    var ocs = run.querySelectorAll('.oc');
    if(!ocs.length || !orbitBox) return;
    var W = orbitBox.clientWidth;      /* 播送带实测带宽 */
    if(!W) return;
    /* 结构复刻课件封面：每副本 = 一整带宽（.oc 宽 50% × orbitRun 200%）。
       字号收紧到「完整句子落入可见区」（实测 48 字 ≈ 49.7em 宽），
       保证整句不换行、不被带缘裁切；窄屏保底下限 11px（届时改为滚动渐隐）。 */
    var fs = Math.max(11, Math.min(16, (W * 0.93) / 49.7));
    run.style.fontSize = fs.toFixed(1) + 'px';
    /* 时长 = 带宽 ÷ 28.4px/s（速度口径复刻课件首页） */
    run.style.animationDuration = (W / 28.4).toFixed(1) + 's';
  }
  var rzT = null;
  function onResize(){
    if(rzT) clearTimeout(rzT);
    rzT = setTimeout(fitOrbit, 180);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('load', fitOrbit);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitOrbit); }
  setTimeout(fitOrbit, 400);

  /* ---------- 轻提示 ---------- */
  function toast(msg){
    var old = document.querySelector('.toast');
    if(old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){
      t.classList.remove('show');
      setTimeout(function(){ t.remove(); }, 360);
    }, 2000);
  }

  /* ---------- 课件卡片：数据模型驱动 ---------- */
  var MAX_VISIBLE = 10;          /* 同屏最多显示 10 个课件位，超出折叠 */
  var row = document.getElementById('cardRow');
  var moreBtn = document.getElementById('moreBtn');
  var moreLabel = document.getElementById('moreLabel');
  var moreCount = document.getElementById('moreCount');

  /* 初始模型直接采自静态 DOM（单一数据源：无 JS 时静态卡片依然可见） */
  var items = [];
  Array.prototype.forEach.call(row.children, function(el){
    var href = el.getAttribute('data-href');
    if(href){
      items.push({
        type:'course', href:href,
        title:el.getAttribute('data-title') || '',
        sub:el.getAttribute('data-sub') || '',
        icon:el.getAttribute('data-icon') || '课',
        pinned:el.hasAttribute('data-pinned')
      });
    }else{
      items.push({ type:'slot' });
    }
  });
  var expanded = false;

  /* 「添加课件位」功能卡：固定位于末尾，不参与拖动交换 */
  var addCard = document.createElement('article');
  addCard.className = 'card add';
  addCard.setAttribute('title', '添加更多课件位');
  addCard.draggable = false;
  addCard.innerHTML =
    '<span class="shine"></span>' +
    '<span class="icon">＋</span>' +
    '<span class="c-title">添加课件位</span>' +
    '<span class="c-sub">点击添加更多栏位</span>';

  function buildCard(item){
    var card = document.createElement('article');
    if(item.type === 'course'){
      card.className = 'card game';
      card.setAttribute('data-href', item.href);
      card.setAttribute('title', item.title);
      card.draggable = true;
      card.innerHTML =
        (item.pinned ? '<span class="pin">置顶</span>' : '') +
        '<span class="shine"></span>' +
        '<span class="icon">' + item.icon + '</span>' +
        '<span class="c-title">' + item.title + '</span>' +
        '<span class="c-sub">' + item.sub + '</span>' +
        '<span class="cta">点击进入 <i>›</i></span>';
    }else{
      card.className = 'card slot';
      card.setAttribute('title', '预留课件位');
      card.draggable = true;
      card.innerHTML =
        '<span class="shine"></span>' +
        '<span class="icon">＋</span>' +
        '<span class="c-title">虚位以待</span>' +
        '<span class="c-sub">预留互动游戏课件位</span>';
    }
    return card;
  }

  function render(){
    row.innerHTML = '';
    var visible = expanded ? items.length : Math.min(items.length, MAX_VISIBLE);
    items.forEach(function(item, i){
      var card = buildCard(item);
      if(i >= visible) card.classList.add('is-hidden');
      row.appendChild(card);
    });
    row.appendChild(addCard);

    var hidden = items.length - MAX_VISIBLE;
    if(hidden > 0){
      moreBtn.style.display = 'inline-block';
      moreCount.textContent = '（' + hidden + '）';
      moreLabel.textContent = expanded ? '收起课件' : '更多课件';
      moreBtn.classList.toggle('open', expanded);
      moreBtn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    }else{
      moreBtn.style.display = 'none';
    }
    bindCards();
  }

  /* ---------- 拖动交换 + 点击行为 ---------- */
  var dragEl = null;
  var suppressClick = false;

  function bindCards(){
    var cards = row.querySelectorAll('.card:not(.add)');
    Array.prototype.forEach.call(cards, function(card){
      card.addEventListener('dragstart', function(e){
        dragEl = card;
        suppressClick = true;
        card.classList.add('dragging');
        if(e.dataTransfer){
          e.dataTransfer.effectAllowed = 'move';
          try{ e.dataTransfer.setData('text/plain', 'card'); }catch(err){}
        }
      });
      card.addEventListener('dragend', function(){
        card.classList.remove('dragging');
        cards.forEach(function(c){ c.classList.remove('dropzone'); });
        dragEl = null;
      });
      card.addEventListener('dragover', function(e){
        if(!dragEl || dragEl === card) return;
        e.preventDefault();
        if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        card.classList.add('dropzone');
      });
      card.addEventListener('dragleave', function(){
        card.classList.remove('dropzone');
      });
      card.addEventListener('drop', function(e){
        e.preventDefault();
        card.classList.remove('dropzone');
        if(!dragEl || dragEl === card) return;
        /* 交换两张卡片的位置（占位节点法，任意相对位置都安全） */
        var kids = Array.prototype.filter.call(row.children, function(el){ return el !== addCard; });
        var i = kids.indexOf(dragEl), j = kids.indexOf(card);
        if(i > -1 && j > -1){
          var tmp = items[i]; items[i] = items[j]; items[j] = tmp;
        }
        var ph = document.createElement('div');
        ph.style.display = 'none';
        row.insertBefore(ph, card);
        row.insertBefore(card, dragEl);
        row.replaceChild(dragEl, ph);
        dragEl = null;
      });
      card.addEventListener('click', function(){
        if(suppressClick){ suppressClick = false; return; }   /* 拖动结束误触的 click 吞掉 */
        var href = card.getAttribute('data-href');
        if(href){ window.location.href = href; }
        else{ toast('该课件位虚位以待，敬请期待～'); }
      });
    });
  }

  /* ---------- 添加课件位（数量不限） ---------- */
  addCard.addEventListener('click', function(){
    items.push({ type:'slot' });
    var autoExpanded = false;
    if(!expanded && items.length > MAX_VISIBLE){ expanded = true; autoExpanded = true; }
    render();
    toast(autoExpanded ? '已添加课件位，超出 10 个的部分已自动展开' : '已添加一个预留课件位～');
  });

  /* ---------- 更多 / 收起折叠 ---------- */
  moreBtn.addEventListener('click', function(){
    expanded = !expanded;
    render();
  });

  /* ---------- 背景切换器：密钥解锁 + 切换/导入/删除 + 智能拉伸 ---------- */
  (function(){
    var KEY = 'zyywz2026';
    var LS = 'hehe-bg-switch-v1';
    var builtin = [
      { id:'bg.jpg',  name:'蓝白水彩 · 高清原图' },
      { id:'bg2.jpg', name:'暖调柔焦 · 梦境治愈' }
    ];
    var state = { active:'bg.jpg', stretch:false, custom:[] };
    try{
      var s = JSON.parse(localStorage.getItem(LS) || 'null');
      if(s && typeof s.active === 'string'){
        state.active = s.active;
        state.stretch = !!s.stretch;
        if(Array.isArray(s.custom)) state.custom = s.custom;
      }
    }catch(e){}
    /* 防御：记录里的 active 若是失效的 dataURL 或未知值，回退到默认背景 */
    var knownCustom = state.custom.some(function(c){ return c.id === state.active; });
    if(state.active !== 'bg.jpg' && state.active !== 'bg2.jpg' && !knownCustom){
      state.active = 'bg.jpg';
    }

    var btn     = document.getElementById('bgBtn');
    var panel   = document.getElementById('bgPanel');
    var pwd     = document.getElementById('bgPwd');
    var err     = document.getElementById('bgErr');
    var unlockB = document.getElementById('bgUnlock');
    var list    = document.getElementById('bgList');
    var ops     = document.getElementById('bgOps');
    var file    = document.getElementById('bgFile');
    var stretch = document.getElementById('bgStretch');
    var fxSec   = document.getElementById('fxSec');
    var fxList  = document.getElementById('fxList');

    function persist(){
      try{ localStorage.setItem(LS, JSON.stringify(state)); return true; }
      catch(e){ return false; }
    }
    function applyBg(url){
      var art = document.querySelector('.bgArt');
      var seam = document.querySelector('.bgSeam');
      var cat = document.querySelector('.bgCat');
      if(art)  art.style.backgroundImage  = "url('" + url + "')";
      if(seam) seam.style.backgroundImage = "url('" + url + "')";
      /* 猫形遮挡层联动：仅内置双图（同猫构图）套遮挡层；导入的自定义图无猫形，隐藏 */
      if(cat){
        if(url === 'bg.jpg' || url === 'bg2.jpg'){
          cat.style.display = '';
          cat.style.backgroundImage = "url('cat-cut" + (url === 'bg2.jpg' ? '2' : '') + ".png')";
        }else{
          cat.style.display = 'none';
        }
      }
      sampleBadgeFill(url);   /* 角标填充色跟随底图重采 */
    }
    function applyStretch(on){
      var art = document.querySelector('.bgArt');
      var seam = document.querySelector('.bgSeam');
      var cat = document.querySelector('.bgCat');
      if(!art) return;
      if(on){
        art.style.height = '100%';
        art.style.backgroundSize = '100% 100%';
        if(seam) seam.style.display = 'none';
        if(cat){ cat.style.height = '100%'; cat.style.backgroundSize = '100% 100%'; }
      }else{
        art.style.height = '';
        art.style.backgroundSize = '';
        if(seam) seam.style.display = '';
        if(cat){ cat.style.height = ''; cat.style.backgroundSize = ''; }
      }
      sampleBadgeFill(state.active);   /* 拉伸改变底图几何映射，重采角标填充色 */
    }
    function isCustom(id){ return state.custom.some(function(c){ return c.id === id; }); }

    /* ---------- 「浦外」角标填充色 = 当前背景图同款水色（动态采样） ----------
       角标坐落在标题区上方，该处背景即水面/天空；用 canvas 采样当前底图在
       角标身后区域（box 外扩 70%）的颜色，上/中/下三段均色生成竖向渐变
       （上提亮 10%、下压暗 10% 形成可见渐变，色相仍取底图同款），
       切换/导入背景、开关拉伸、视口变化后自动重采；
       采样失败（画布被污染等）时保留 CSS 兜底渐变（图1 水色）。 */
    var fillSeq = 0;
    function sampleBadgeFill(url){
      var badge = document.querySelector('.titleBadge');
      var box = badge && badge.querySelector('i');
      var art = document.querySelector('.bgArt');
      if(!badge || !box || !art || !url) return;
      var seq = ++fillSeq;
      var img = new Image();
      img.onload = function(){
        if(seq !== fillSeq) return;   /* 只认最后一次采样，防连切背景时竞争 */
        try{
          /* 用布局坐标（offsetLeft/Top）而非 getBoundingClientRect：
             角标随大标题一同浮动，rect 含浮动位移会使采样区随相位上下漂移；
             布局坐标恒定，填充色只取决于底图与版面，与浮动相位无关 */
          var tR = title.getBoundingClientRect();
          var vbL = tR.left  + badge.offsetLeft;
          var vbT = tR.top   + badge.offsetTop;
          var vbW = badge.offsetWidth, vbH = badge.offsetHeight;
          var ar = art.getBoundingClientRect();
          if(vbW < 4 || ar.width < 4 || ar.height < 4) return;
          var kx = img.naturalWidth / ar.width;
          var ky = img.naturalHeight / ar.height;
          var ex = vbW * .7, ey = vbH * .7;
          var x0 = Math.max(0, Math.floor((vbL      - ex) * kx));
          var y0 = Math.max(0, Math.floor((vbT      - ey) * ky));
          var x1 = Math.min(img.naturalWidth,  Math.ceil((vbL + vbW + ex) * kx));
          var y1 = Math.min(img.naturalHeight, Math.ceil((vbT + vbH + ey) * ky));
          var w = x1 - x0, h = y1 - y0;
          if(w < 2 || h < 2) return;
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, x0, y0, w, h, 0, 0, w, h);
          var d = ctx.getImageData(0, 0, w, h).data;
          function avg(ya, yb){
            var r = 0, g = 0, b = 0, n = 0;
            var ys = Math.max(0, Math.floor(ya)), ye = Math.min(h, Math.floor(yb));
            for(var y = ys; y < ye; y++) for(var x = 0; x < w; x++){
              var i = (y * w + x) * 4;
              r += d[i]; g += d[i+1]; b += d[i+2]; n++;
            }
            return n ? [r/n, g/n, b/n] : null;
          }
          var top = avg(0, h/3), mid = avg(h/3, h*2/3), bot = avg(h*2/3, h);
          if(!top || !mid || !bot) return;
          function css(col, f){
            return 'rgb(' + Math.round(Math.min(255, col[0]*f)) + ',' +
                              Math.round(Math.min(255, col[1]*f)) + ',' +
                              Math.round(Math.min(255, col[2]*f)) + ')';
          }
          box.style.backgroundImage = 'linear-gradient(180deg,' +
            css(top, 1.10) + ' 0%,' + css(mid, 1) + ' 52%,' + css(bot, .90) + ' 100%)';
        }catch(e){ /* 采样失败：保留 CSS 兜底渐变 */ }
      };
      img.onerror = function(){ /* 加载失败：保留兜底 */ };
      img.src = url;
    }

    /* ---------- 网页动态特效：注册表驱动（多选叠加 / 可全关） ----------
       新增特效三步：① 在 .bg 背景栈里加一个效果层（如 <div class="fxXxx"></div>）；
       ② 在下方 FX 数组登记 { id, name, layer, def }；③ 收工——面板自动长出勾选项。
       各特效层独立显隐 ⇒ 支持多选叠加；全部不勾 = 回到纯静态背景。
       偏好存 localStorage 'hehe-fx-switch-v1'（与背景偏好 'hehe-bg-switch-v1' 分开，互不污染）。 */
    var FXS_KEY = 'hehe-fx-switch-v1';
    var FX = [
      { id:'ripple', name:'水面涟漪', layer:'.ripples', def:true }
    ];
    var fxOn = FX.filter(function(f){ return f.def; }).map(function(f){ return f.id; });
    try{
      var fxsRaw = JSON.parse(localStorage.getItem(FXS_KEY) || 'null');
      if(Array.isArray(fxsRaw)){
        fxOn = fxsRaw.filter(function(id){ return FX.some(function(f){ return f.id === id; }); });
      }
    }catch(e){}
    function persistFx(){
      try{ localStorage.setItem(FXS_KEY, JSON.stringify(fxOn)); return true; }
      catch(e){ return false; }
    }
    function applyFx(){
      FX.forEach(function(f){
        var el = document.querySelector(f.layer);
        if(el) el.style.display = (fxOn.indexOf(f.id) > -1) ? '' : 'none';
      });
    }
    function renderFx(){
      if(!fxList) return;
      fxList.innerHTML = '';
      FX.forEach(function(f){
        var on = fxOn.indexOf(f.id) > -1;
        var lab = document.createElement('label');
        lab.className = 'fxItem' + (on ? ' on' : '');
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = on;
        cb.addEventListener('change', function(){
          var i = fxOn.indexOf(f.id);
          if(cb.checked && i < 0) fxOn.push(f.id);
          if(!cb.checked && i > -1) fxOn.splice(i, 1);
          if(!persistFx()) toast('浏览器存储空间不足，特效偏好未保存');
          applyFx();
          lab.classList.toggle('on', cb.checked);
          var onNames = FX.filter(function(x){ return fxOn.indexOf(x.id) > -1; })
                          .map(function(x){ return x.name; });
          toast(onNames.length ? '特效已更新：' + onNames.join('＋') : '已关闭全部动态特效');
        });
        var nm = document.createElement('span');
        nm.textContent = f.name;
        lab.appendChild(cb); lab.appendChild(nm);
        if(f.def){
          var tag = document.createElement('span');
          tag.className = 'fxDef'; tag.textContent = '默认';
          lab.appendChild(tag);
        }
        fxList.appendChild(lab);
      });
    }

    function render(){
      list.innerHTML = '';
      builtin.concat(state.custom).forEach(function(item){
        var row = document.createElement('div');
        row.className = 'bgItem' + (state.active === item.id ? ' active' : '');
        var thumb = document.createElement('img');
        thumb.className = 'bgThumb'; thumb.alt = ''; thumb.src = item.id;
        var name = document.createElement('span');
        name.className = 'bgName'; name.textContent = item.name;
        row.appendChild(thumb); row.appendChild(name);
        row.addEventListener('click', function(ev){
          ev.stopPropagation();
          state.active = item.id;
          if(!persist()) toast('浏览器存储空间不足，偏好未保存');
          applyBg(item.id);
          render();
          toast('已切换背景：' + item.name);
        });
        if(isCustom(item.id)){
          var del = document.createElement('button');
          del.className = 'bgDel'; del.type = 'button'; del.title = '删除这张背景';
          del.textContent = '✕';
          del.addEventListener('click', function(ev){
            ev.stopPropagation();
            state.custom = state.custom.filter(function(c){ return c.id !== item.id; });
            if(state.active === item.id){
              state.active = 'bg.jpg';
              applyBg('bg.jpg');
            }
            persist(); render();
            toast('已删除该背景');
          });
          row.appendChild(del);
        }
        list.appendChild(row);
      });
      stretch.checked = !!state.stretch;
    }

    function unlock(){
      var v = (pwd.value || '').trim();
      if(v === KEY){
        err.textContent = '';
        list.classList.add('on'); ops.classList.add('on'); fxSec.classList.add('on');
        pwd.disabled = true; unlockB.disabled = true;   /* 箭头保留仅置灰（课件同款：门开即静默） */
        render(); renderFx();
        toast('背景管理已解锁');
      }else{
        err.textContent = '密钥不对，请重试';
        pwd.classList.remove('bad');
        void pwd.offsetWidth;
        pwd.classList.add('bad');
        setTimeout(function(){ pwd.classList.remove('bad'); }, 450);
      }
    }

    function readImage(f){
      return new Promise(function(res, rej){
        var fr = new FileReader();
        fr.onload = function(){
          var img = new Image();
          img.onload = function(){
            try{
              var maxW = 1920, w = img.naturalWidth, h = img.naturalHeight;
              if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
              var c = document.createElement('canvas');
              c.width = w; c.height = h;
              c.getContext('2d').drawImage(img, 0, 0, w, h);
              res(c.toDataURL('image/jpeg', .85));
            }catch(e){ rej(e); }
          };
          img.onerror = function(){ rej(new Error('decode')); };
          img.src = fr.result;
        };
        fr.onerror = function(){ rej(new Error('read')); };
        fr.readAsDataURL(f);
      });
    }

    file.addEventListener('change', function(){
      var f = file.files && file.files[0];
      file.value = '';
      if(!f) return;
      if(!/^image\//.test(f.type)){ toast('请选择图片文件'); return; }
      readImage(f).then(function(dataUrl){
        var name = (f.name || '导入图片').replace(/\.[^.]+$/, '').slice(0, 10) || '导入图片';
        state.custom.push({ id: dataUrl, name: name });
        if(!persist()){
          state.custom.pop();
          toast('浏览器存储空间不足，导入失败');
          return;
        }
        state.active = dataUrl;
        applyBg(dataUrl); render();
        toast('已导入并切换：' + name);
      }).catch(function(){ toast('图片读取失败，请换一张试试'); });
    });

    stretch.addEventListener('change', function(){
      state.stretch = stretch.checked;
      persist();
      applyStretch(state.stretch);
      toast(state.stretch ? '已开启：智能拉伸至满屏' : '已关闭：恢复原画横带');
    });

    unlockB.addEventListener('click', unlock);
    pwd.addEventListener('keydown', function(e){ if(e.key === 'Enter') unlock(); });

    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      panel.classList.toggle('open');
    });
    document.addEventListener('click', function(ev){
      if(!panel.classList.contains('open')) return;
      if(panel.contains(ev.target) || btn.contains(ev.target)) return;
      panel.classList.remove('open');
    });

    /* 初始化：恢复上次选择与拉伸偏好 + 特效开关 */
    applyBg(state.active);
    applyStretch(state.stretch);
    applyFx();
    /* 手写子集字体异步就绪 / 窗口加载后再补采一次（以稳定布局测角标位置） */
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){ sampleBadgeFill(state.active); });
    }
    window.addEventListener('load', function(){ sampleBadgeFill(state.active); });
    /* 视口变化 → 角标在底图上的映射区域变化，防抖重采 */
    var rzBadge = null;
    window.addEventListener('resize', function(){
      if(rzBadge) clearTimeout(rzBadge);
      rzBadge = setTimeout(function(){ sampleBadgeFill(state.active); }, 220);
    });
  })();

  render();
})();
</script>

</body>

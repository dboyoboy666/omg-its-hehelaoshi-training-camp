<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>鼎铭小史官 · 大篆训练营</title>
<style>
/* =====================================================================
   鼎铭小史官 · 大篆训练营 —— 青铜主题设计系统
   四色体系：青铜底 / 宣纸面板 / 朱砂 / 鎏金 + 铜绿点缀
   ===================================================================== */
:root{
  --bg1:#1c1710; --bg2:#2b2318;
  --paper:#f1e8d6; --paper2:#e6dac2; --paper3:#d9cbae;
  --ink:#241c14; --muted:#7d7062;
  --cin:#b03a2e; --cin-deep:#8e2b21;
  --gold:#c9a227; --gold-hi:#e8c96a;
  --patina:#3f7d5c; --patina-deep:#2e5f45;
  --ok:#1d9e75; --warn:#ef9f27;
  --r:16px; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--paper);
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(201,162,39,.10), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(63,125,92,.14), transparent 55%),
    linear-gradient(160deg, var(--bg2), var(--bg1));
  overflow:hidden;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;}

/* ---- 顶栏 ---- */
#top{position:fixed;top:0;left:0;right:0;height:56px;z-index:20;display:flex;align-items:center;
  padding:0 16px;gap:12px;background:linear-gradient(180deg,rgba(20,16,10,.92),rgba(20,16,10,.75));
  border-bottom:1px solid rgba(201,162,39,.25);backdrop-filter:blur(6px);}
#top .brand{font-weight:800;letter-spacing:1px;font-size:16px;
  background:linear-gradient(90deg,var(--gold-hi),var(--gold),var(--gold-hi));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;}
#top .brand small{font-size:11px;letter-spacing:2px;opacity:.8;}
#top .sp{flex:1;}
.tbtn{border:1px solid rgba(201,162,39,.4);background:rgba(241,232,214,.08);color:var(--paper);
  border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;transition:.15s;}
.tbtn:hover{background:rgba(241,232,214,.18);}
.tbtn:disabled{opacity:.4;cursor:not-allowed;}
#diffBadge{font-size:12px;color:var(--gold-hi);border:1px dashed rgba(201,162,39,.5);
  border-radius:999px;padding:4px 10px;white-space:nowrap;}

/* ---- deck 幻灯牌 ---- */
#deck{position:fixed;inset:56px 0 0 0;overflow:hidden;}
.slide{position:absolute;inset:0;padding:18px clamp(10px,3vw,36px) 26px;overflow-y:auto;overflow-x:hidden;
  display:none;animation:slideIn .38s cubic-bezier(.22,.9,.3,1);}
.slide.on{display:block;}
@keyframes slideIn{from{opacity:0;transform:translateY(16px) scale(.995)}to{opacity:1;transform:none}}
.wrap{max-width:1020px;margin:0 auto;}

/* ---- 通用组件 ---- */
.panel{background:var(--paper);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);
  padding:18px 20px;}
.panel.dark{background:linear-gradient(160deg,#241d12,#1b150d);color:var(--paper);
  border:1px solid rgba(201,162,39,.3);}
.h1{font-size:clamp(20px,3vw,26px);font-weight:800;margin:6px 0 4px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:none;border-radius:14px;padding:13px 22px;font-size:16px;font-weight:700;
  background:linear-gradient(180deg,#8e2b21,#6e1f17);color:#fff;letter-spacing:2px;
  box-shadow:0 6px 18px rgba(176,58,46,.35);transition:.15s;user-select:none;}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(176,58,46,.45);}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),#a8841c);color:#241c14;
  box-shadow:0 6px 18px rgba(201,162,39,.35);}
.btn.ghost{background:rgba(241,232,214,.1);color:var(--paper);border:1px solid rgba(241,232,214,.35);box-shadow:none;}
/* 浅色面板（panel/drawside）上的 ghost 按钮改墨色：米色字在米色底上不可读（真机截图抓到） */
.panel .btn.ghost,.drawside .btn.ghost{color:var(--ink);border-color:var(--paper3);background:rgba(36,28,20,.05);}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px;letter-spacing:1px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;
  border:1.5px solid var(--paper3);background:#fff8;color:var(--ink);cursor:pointer;font-size:14px;
  font-weight:600;transition:.15s;user-select:none;}
.chip.on{border-color:var(--cin);background:var(--cin);color:#fff;box-shadow:0 4px 12px rgba(176,58,46,.35);}
.bigchar{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:64px;line-height:1;color:var(--ink);}

/* ---- 封面 ---- */
#s0 .cover{max-width:1020px;margin:0 auto;text-align:center;padding-top:2vh;}
.orb{display:flex;justify-content:center;gap:clamp(4px,1.4vw,14px);margin:10px 0 2px;}
.orb span{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-weight:900;
  font-size:clamp(44px,8.5vw,84px);line-height:1.15;
  background:linear-gradient(115deg,var(--gold-hi) 10%,var(--gold) 35%,var(--patina) 55%,var(--gold-hi) 85%);
  background-size:220% 220%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:orbFloat 5.2s ease-in-out infinite, orbSheen 6.5s linear infinite;}
.orb span:nth-child(1){animation-delay:.0s,.0s}.orb span:nth-child(2){animation-delay:.7s,.9s}
.orb span:nth-child(3){animation-delay:1.4s,1.8s}.orb span:nth-child(4){animation-delay:2.1s,2.7s}
.orb span:nth-child(5){animation-delay:2.8s,3.6s}.orb span:nth-child(6){animation-delay:3.5s,4.5s}
.orb span:nth-child(7){animation-delay:4.2s,5.4s}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes orbSheen{0%{background-position:0% 40%}50%{background-position:100% 60%}100%{background-position:0% 40%}}
.tagline{color:#cbbd9d;font-size:clamp(13px,1.8vw,16px);letter-spacing:3px;margin:2px 0 4px;}
.tagline b{color:var(--gold-hi);}
.coverBtns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:16px 0 26px;}
.coverBtns .btn{min-width:190px;}
.setupCard{max-width:640px;margin:0 auto;}
.setupCard .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:10px;}
.setupCard .nameInput{width:180px;padding:7px 12px;border-radius:10px;border:2px solid rgba(201,162,39,.5);
  background:rgba(0,0,0,.25);color:var(--gold-hi);font-family:"STKaiti","Kaiti SC",KaiTi,serif;
  font-size:16px;font-weight:700;text-align:center;letter-spacing:1px;outline:none;}
.setupCard .nameInput:focus{border-color:var(--gold-hi);box-shadow:0 0 0 2px rgba(232,201,106,.25);}
.setupCard .nameInput::placeholder{color:#8d7f63;font-weight:400;}
.setupCard .lab{font-size:13px;color:var(--muted);width:100%;text-align:center;letter-spacing:2px;}
.footNote{color:#8d7f63;font-size:11px;margin-top:14px;letter-spacing:1px;}

/* ---- 字表 ---- */
.gridChars{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;}
.cell{background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 6px 6px;text-align:center;
  cursor:pointer;position:relative;transition:.15s;border:2px solid transparent;}
.cell:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.35);}
.cell svg{width:56px;height:56px;display:block;margin:0 auto;}
.cell .kai{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:17px;font-weight:700;margin-top:2px;}
.cell .lv{position:absolute;top:5px;left:7px;font-size:10px;color:var(--muted);}
.cell.rubbed{border-color:var(--patina);}
.cell.rubbed::after{content:"拓";position:absolute;right:5px;top:3px;font-size:10px;color:var(--patina);font-weight:700;}
.progLine{display:flex;align-items:center;gap:10px;margin:8px 2px 14px;font-size:13px;color:#cbbd9d;}
.progLine .bar{flex:1;height:10px;border-radius:999px;background:rgba(241,232,214,.14);overflow:hidden;}
.progLine .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--patina),var(--gold));width:0%;transition:width .6s;}

/* ---- 问答（识铭/辨铭/PK 题面共用） ---- */
.qsWrap{max-width:760px;margin:0 auto;}
.stemBox{display:flex;justify-content:center;margin:8px 0 16px;}
.stemBox .glyphCard{background:var(--paper);border-radius:20px;padding:14px;box-shadow:var(--shadow);
  border:3px solid var(--gold);}
.stemBox svg{width:clamp(150px,26vw,210px);height:clamp(150px,26vw,210px);display:block;}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.opts.c4{grid-template-columns:repeat(4,1fr);}
@media (max-width:720px){.opts.c4{grid-template-columns:repeat(2,1fr);}}
.opt{background:var(--paper);color:var(--ink);border-radius:16px;border:2.5px solid transparent;
  font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:clamp(30px,5vw,44px);font-weight:700;
  padding:16px 6px;text-align:center;cursor:pointer;transition:.15s;user-select:none;}
.opt:hover{transform:translateY(-3px);border-color:var(--gold);}
.opt.right{border-color:var(--ok);background:#e9f7f1;animation:popOk .4s;}
.opt.wrong{border-color:var(--cin);background:#f9e9e7;animation:shake .35s;}
.opt:disabled{cursor:default;transform:none;}
@keyframes popOk{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qTop{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto 6px;}
.qTop .prog{flex:1;height:9px;border-radius:999px;background:rgba(241,232,214,.14);overflow:hidden;}
.qTop .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cin));width:0%;transition:width .4s;}
.qTop .marks{font-size:14px;color:var(--gold-hi);white-space:nowrap;font-weight:700;}
.qTop .timer{font-size:14px;font-weight:800;min-width:52px;text-align:center;color:var(--paper);}
.qTop .timer.urgent{color:#ff6b5e;animation:pulse .5s infinite;}
@keyframes pulse{50%{opacity:.45}}
.qFeed{text-align:center;min-height:30px;margin-top:12px;font-size:15px;font-weight:700;}
.qFeed.good{color:var(--ok);} .qFeed.bad{color:#ff8f83;}

/* ---- 写铭（描红） ---- */
.trWrap{display:grid;grid-template-columns:minmax(280px,420px) minmax(260px,1fr);gap:18px;
  max-width:920px;margin:0 auto;align-items:start;}
@media (max-width:760px){.trWrap{grid-template-columns:1fr;}}
.cvbox{position:relative;width:100%;touch-action:none;}
.cvbox canvas{position:absolute;inset:0;width:100%;height:100%;}
.cvbox canvas:first-child{position:relative;}
.trPanel .charMeta{display:flex;align-items:baseline;gap:12px;}
.trPanel .charMeta .big{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:40px;font-weight:800;}
.trPanel .charMeta .py{color:var(--muted);font-size:14px;}
.verdict{font-size:15px;font-weight:800;margin:10px 0 4px;}
.scoreRow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
.scoreTag{border-radius:10px;padding:6px 10px;font-size:12px;background:var(--paper2);color:var(--ink);font-weight:700;}
.scoreTag b{font-size:15px;}
.strokeChips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;}
.sChip{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;background:var(--paper2);color:var(--muted);}
.sChip.ok{background:#d9efe6;color:var(--ok);}
.sChip.bad{background:#f6d9d5;color:var(--cin-deep);}
.sChip.unfinished{background:#2c2c2c;color:#ff8f83;}
.trBtns{display:flex;gap:10px;flex-wrap:wrap;}
.bandNote{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;}

/* ---- 铸鼎 ---- */
.castWrap{max-width:860px;margin:0 auto;text-align:center;}
.dingBox{position:relative;display:inline-block;margin:6px 0 4px;}
.dingBox svg{width:min(78vw,520px);height:auto;display:block;}
#dingSlots{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);
  display:grid;grid-template-columns:repeat(7,1fr);gap:2px;width:56%;}
.slotChar{font-family:"STKaiti","Kaiti SC",KaiTi,serif;color:#ffe9ad;opacity:0;
  font-size:clamp(13px,2.8vw,22px);text-align:center;transform:scale(2.2) translateY(-14px);
  transition:all .5s cubic-bezier(.2,.8,.3,1.2);
  text-shadow:0 0 6px rgba(255,214,90,1),0 1px 2px rgba(40,28,8,.9);font-weight:700;}
.slotChar.in{opacity:.96;transform:none;}
/* 落字（何何老师 2026-10-06 定稿）：不再是金色小球点缀，字带金边亲自落鼎——
   charDrop .55s 加速下落（-84px→0），落程中金边渐亮（brightness 1→1.6）、渐宽（描边 .5→2px）、
   外围边缘渐柔渐模糊（text-shadow 光晕半径随之下增长，字身保持清晰）；
   落定那一刻 charFlash 接棒 1s：整字连金边一起脉冲闪烁（每字独立计时，前后字并行互不影响），
   播完自动回归常态。两段 0%/100% 关键帧首尾相接（落定态/常态），接缝无跳变 */
.slotChar.in.flash{animation:charDrop .55s cubic-bezier(.55,.06,.68,.19), charFlash 1s ease-in-out .55s;}
/* 落点向量由 JS 逐字写入 CSS 变量（--dx/--dy：四向随机 + 距离 60~130px + 垂直抖动），关键帧只认变量 */
@keyframes charDrop{
  0%{opacity:0;transform:translate(var(--dx,0px),var(--dy,-84px)) scale(1.35);
    -webkit-text-stroke:.5px rgba(255,215,106,.35);
    text-shadow:0 0 4px rgba(255,214,90,.45),0 1px 2px rgba(40,28,8,.9);
    filter:brightness(1);}
  55%{opacity:.96;
    -webkit-text-stroke:1.2px rgba(255,215,106,.8);
    text-shadow:0 0 9px rgba(255,214,90,.8),0 0 20px rgba(255,183,74,.4),0 1px 2px rgba(40,28,8,.9);
    filter:brightness(1.35);}
  100%{opacity:.96;transform:none;
    -webkit-text-stroke:2px #ffd76a;
    text-shadow:0 0 14px rgba(255,214,90,.95),0 0 30px rgba(255,184,74,.6),0 1px 2px rgba(40,28,8,.9);
    filter:brightness(1.6);}
}
/* 落定闪烁（1s）：0% 接住 charDrop 落定态（无跳变）→ 3 个强光峰（金边同加宽至 2.5px）→ 100% 回归 .in 常态 */
@keyframes charFlash{
  0%{-webkit-text-stroke:2px #ffd76a;
    text-shadow:0 0 14px rgba(255,214,90,.95),0 0 30px rgba(255,184,74,.6),0 1px 2px rgba(40,28,8,.9);
    filter:brightness(1.6);}
  15%,45%,80%{-webkit-text-stroke:2.5px #ffe9ad;
    text-shadow:0 0 20px #fff3cd,0 0 38px #ffd76a,0 0 60px #ffb84a;filter:brightness(2.6);}
  30%,62%{-webkit-text-stroke:1.6px rgba(255,215,106,.85);
    text-shadow:0 0 9px rgba(255,214,90,1);filter:brightness(1.25);}
  100%{-webkit-text-stroke:0px rgba(255,215,106,0);
    text-shadow:0 0 6px rgba(255,214,90,1),0 1px 2px rgba(40,28,8,.9);filter:brightness(1);}
}
/* 全部铸完：整鼎（鼎身+字）整体高亮脉冲闪烁 2 秒 */
.dingBox.dingFlash{animation:dingFlash 2s ease-in-out;}
@keyframes dingFlash{
  0%,100%{filter:brightness(1);}
  15%,45%,80%{filter:brightness(2.2) drop-shadow(0 0 36px rgba(232,201,106,.9)) drop-shadow(0 0 90px rgba(255,214,90,.5));}
  30%,62%{filter:brightness(1.3) drop-shadow(0 0 14px rgba(232,201,106,.45));}
}
.castCaption{font-size:15px;color:#cbbd9d;min-height:26px;}
.castCaption b{color:var(--gold-hi);}

/* ---- 结算 ---- */
.resWrap{max-width:640px;margin:0 auto;text-align:center;}
.resScore{font-size:clamp(46px,9vw,72px);font-weight:900;line-height:1;
  background:linear-gradient(115deg,var(--gold-hi),var(--gold),var(--gold-hi));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.resTitle{font-size:clamp(19px,3vw,24px);font-weight:800;color:var(--gold-hi);margin:10px 0 6px;}
.resWord{font-size:14px;color:#cbbd9d;line-height:1.8;margin-bottom:16px;}
.resStats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0 20px;}
.resStat{background:rgba(241,232,214,.08);border:1px solid rgba(201,162,39,.3);border-radius:14px;
  padding:10px 18px;min-width:104px;}
.resStat .v{font-size:22px;font-weight:800;color:var(--gold-hi);}
.resStat .k{font-size:11px;color:#9d9078;letter-spacing:1px;}
.resBtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* ---- 双人（V3 继承 v6.6.618 特效体系） ---- */
.duoForm{max-width:640px;margin:0 auto;text-align:center;}
.duoForm input{width:min(100%,240px);border:2px solid var(--paper3);border-radius:12px;padding:12px 14px;
  font-size:16px;text-align:center;background:var(--paper);color:var(--ink);font-weight:700;outline:none;}
.duoForm input:focus{border-color:var(--gold);}
.vsRow{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0;}
.rosterArea{width:100%;height:88px;margin-top:8px;border:1px solid var(--paper3);border-radius:10px;
  padding:9px;font-family:inherit;font-size:14px;background:rgba(241,232,214,.9);color:var(--ink);resize:vertical;}
.duoCfgLine{font-size:13px;color:#cbbd9d;margin:8px 0 4px;line-height:1.7;}
.duoCfgLine b{color:var(--gold-hi);}
/* 双人 PK 整页禁用浏览器手势（捏合缩放/滚动）——根因：双人触屏书写时任一手指
   瞬间接触画布外区域（起笔悬停/两画布间中缝/卡片边缘），浏览器即激活双指手势，
   手势状态机在所有手指抬离前会吞掉一切新触点（pointercancel），表现为
   "某一方怎么画都没反应"。画布级 touch-action:none 挡不住页级手势，必须整页禁用。
   教室 16:9 投屏 PK 页一屏内展示无滚动需求，代价为零 */
#s8{touch-action:none;}
.pkWrap{max-width:1240px;margin:0 auto;}
.pkwrap{display:grid;grid-template-columns:1fr 26px 1fr;gap:0;align-items:stretch;}
.pkcol{padding:10px 14px;border-radius:14px;border:1px solid rgba(201,162,39,.3);
  background:linear-gradient(172deg,var(--paper),var(--paper2));color:var(--ink);}
.pkcol.act{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.22),var(--shadow);}
.pkcol h3{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:21px;margin:0 0 2px;letter-spacing:.07em;}
.pkcol .pks{font-size:12.5px;color:var(--muted);}
.pkcol .pkv{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:38px;font-weight:700;line-height:1.15;
  font-variant-numeric:tabular-nums;transition:transform .18s;}
.pkcol.L .pkv{background:linear-gradient(180deg,#b03a30,#7c150e);-webkit-background-clip:text;background-clip:text;color:transparent;}
.pkcol.R .pkv{background:linear-gradient(180deg,#2e7a6a,#17453b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.pkv.bump{transform:scale(1.22);}
.hpwrap{position:relative;margin-top:10px;}
.hp{height:22px;border-radius:11px;background:rgba(241,232,214,.14);border:1px solid rgba(201,162,39,.3);overflow:hidden;position:relative;}
.hp i{position:absolute;top:0;bottom:0;left:0;width:50%;background:linear-gradient(90deg,#c0392b,#e07b52);transition:width .5s;}
.hp i.r{left:auto;right:0;background:linear-gradient(270deg,#b8860b,#e0c060);}
.hp i.dominant{animation:hpFlash .38s ease-in-out infinite;z-index:2;}
.hp i.weak{animation:hpBreath 1.05s ease-in-out infinite;}
@keyframes hpFlash{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.9) saturate(1.55)}}

/* 金色闪电分隔（逐字复刻 v6.6.618 可复用资产）：一笔连贯闪电轮廓（不自交，防上下断裂）
   + boltFlick 快闪；8 颗粒子实心亮黄 + 辉光，负延迟错峰持续连发 */
.boltwrap{position:absolute;top:-10px;bottom:-10px;width:36px;transform:translateX(-50%);
  pointer-events:none;z-index:6;}
.boltwrap .bolt{position:absolute;left:50%;top:0;bottom:0;width:20px;transform:translateX(-50%);
  background:linear-gradient(180deg,#fffde7,#ffd700 45%,#ff8f00);
  clip-path:polygon(58% 0,20% 44%,46% 44%,30% 100%,82% 40%,54% 40%);
  animation:boltFlick .16s ease-in-out infinite alternate;}
@keyframes boltFlick{0%{opacity:.7;filter:drop-shadow(0 0 4px #ffd700)}
  100%{opacity:1;filter:drop-shadow(0 0 16px #fff59d) brightness(1.6)}}
.boltwrap .spark{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
  border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 3px rgba(255,215,0,.85);opacity:0;}
.boltwrap .s1{width:8px;height:8px;animation:spk1 .42s linear infinite;animation-delay:-.05s}
.boltwrap .s2{animation:spk2 .5s linear infinite;animation-delay:-.2s}
.boltwrap .s3{width:5px;height:5px;animation:spk3 .36s linear infinite;animation-delay:-.12s}
.boltwrap .s4{animation:spk4 .48s linear infinite;animation-delay:-.33s}
.boltwrap .s5{width:6px;height:6px;animation:spk5 .4s linear infinite;animation-delay:-.26s}
.boltwrap .s6{animation:spk6 .55s linear infinite;animation-delay:-.4s}
.boltwrap .s7{width:5px;height:5px;animation:spk7 .38s linear infinite;animation-delay:-.18s}
.boltwrap .s8{animation:spk8 .46s linear infinite;animation-delay:-.3s}
@keyframes spk1{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-30px,-36px) scale(.15);opacity:0}}
@keyframes spk2{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(30px,-38px) scale(.15);opacity:0}}
@keyframes spk3{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-34px,32px) scale(.2);opacity:0}}
@keyframes spk4{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(34px,34px) scale(.15);opacity:0}}
@keyframes spk5{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-42px,0) scale(.2);opacity:0}}
@keyframes spk6{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(42px,0) scale(.15);opacity:0}}
@keyframes spk7{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-14px,-46px) scale(.2);opacity:0}}
@keyframes spk8{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(14px,46px) scale(.15);opacity:0}}

@keyframes platePop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slamInR{0%{right:-360px;opacity:0;transform:translateY(-50%) scale(.8) rotate(8deg)}
  50%{right:30%;opacity:1;transform:translateY(-50%) scale(1.04) rotate(-3deg)}
  100%{right:auto;left:0;top:auto;opacity:1;transform:translate(0,0) scale(1) rotate(0)}}
@keyframes plateZoom{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.7) rotate(-3deg)}100%{transform:scale(1.32) rotate(-4deg)}}
@keyframes knockedFast{0%{transform:translateX(0) scale(1.32) rotate(-4deg);opacity:1}
  18%{transform:translateX(-40px) scale(1.18) rotate(-160deg);opacity:1}
  100%{transform:translateX(-220vw) scale(.35) rotate(-960deg);opacity:0}}
@keyframes heroGlow{0%{box-shadow:0 0 28px rgba(232,201,106,.7),0 0 60px rgba(201,162,39,.3)}
  100%{box-shadow:0 0 36px rgba(255,233,173,.95),0 0 80px rgba(201,162,39,.45)}}
.dizzy-stars{position:absolute;left:50%;top:-30px;width:0;height:0;z-index:6;pointer-events:none;
  animation:dizzyIn .25s ease-out forwards;}
@keyframes dizzyIn{0%{transform:translate(-50%,6px) scale(.4);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.dizzy-stars span{position:absolute;font-size:26px;color:#e8cd78;line-height:1;
  text-shadow:0 0 10px #c9962a,0 0 22px #fff3cd,0 2px 3px rgba(0,0,0,.28);
  animation:dizzySpin 1.8s linear infinite,dizzyBob .55s ease-in-out infinite alternate;}
@keyframes dizzySpin{0%{transform:rotate(var(--a,0deg)) translateY(-58px) rotate(0)}
  100%{transform:rotate(calc(var(--a,0deg) + 360deg)) translateY(-58px) rotate(-360deg)}}
@keyframes dizzyBob{0%{font-size:26px}100%{font-size:32px}}
.animEmpty{text-align:center;color:#9d9078;padding:40px 0;}

/* ---- 封面播送带（tagline 与按钮行之间的空隙带：环绕接力式循环） ---- */
/* 滚动范围收窄（何何老师 2026-10-06 定稿）：不再横贯全屏，带子 = 功能卡行
   （「开始铸铭」左缘 ↔「拓片墙·榜单」右缘）的精确宽度——
   .coverActions 宽 fit-content 由 .coverBtns 内容撑出，播送带 width:100% 随容器，
   文字只在卡行范围内出画/绕入（壳 overflow:hidden 裁切，slide 另加 overflow-x:hidden 兜底） */
/* 亮度/粗细与 tagline 的「大篆」一致（何何老师 2026-10 定稿）：纯亮金 --gold-hi + 粗体 700，
   不再叠 0.7 透明度与多色渐变（渐变里的铜绿/朱砂暗段会拉暗文字） */
.coverActions{width:fit-content;max-width:100%;margin:0 auto;}
.coverOrbit{position:relative;width:100%;height:28px;
  overflow:hidden;margin-top:0;pointer-events:none;}
.orbitRun{position:absolute;left:0;top:0;width:200%;display:inline-flex;white-space:nowrap;will-change:transform;
  font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-weight:700;font-size:15px;letter-spacing:4px;
  color:var(--gold-hi);
  animation:orbitSweep 29s linear infinite;}
/* 每副本占整整一带宽（文字 + 右侧空白）⇒ 副本间隔一带：
   右端消失多少（S 端出画），左端同步出现多少（上一副本同段绕入），
   带内可见量恒 = 一份完整文案（主体+绕回尾巴相加），结构上不可能同屏两份。
   orbitRun 宽必须显式 200%（i 的百分比才能对着定宽解析），i=50% 即一带宽 */
.orbitRun i{display:inline-block;flex:none;width:50%;font-style:normal;}
/* -50%→0 = 每周期平移一带宽，内容恒向右流；
   时长 = 实测带宽 ÷ 28.4px/s（速度口径延续原 1280 宽/45s，感知速度不变）：
   本轮实测带宽 828.5px（1280/1445 视口一致）→ 29.1s ≈ 29s（28.6px/s，偏差 0.5%）。
   若改按钮文案/字号致带宽变化，按此式重算这一个值 */
@keyframes orbitSweep{from{transform:translateX(-50%)}to{transform:translateX(0)}}

/* ---- 拓片墙 / 榜单 ---- */
.tabRow{display:flex;gap:10px;justify-content:center;margin-bottom:14px;}
/* 难度子榜切换行（2026-10-08 分档定稿：菜鸟/困难/梦魇独立榜单页内切换） */
.diffTabs{display:flex;gap:8px;justify-content:center;margin:4px 0 6px;flex-wrap:wrap;}
.rubGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
.rubCard{border-radius:14px;padding:10px;text-align:center;background:linear-gradient(165deg,#3a332a,#241f18);
  border:1px solid rgba(201,162,39,.35);color:var(--paper);}
.rubCard .glyph svg{width:64px;height:64px;display:block;margin:0 auto;}
.rubCard .glyph svg path{fill:#c0392b !important;}
.rubCard .kai{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:15px;color:var(--gold-hi);margin-top:4px;}
.rubCard.empty{opacity:.32;}
/* 本关完成后首次打开拓片墙：已拓卡逐行巡游——金框高亮闪烁 1 秒/张 */
/* 快闪脉冲（何何老师 2026-10-06 定稿：要金色闪烁，不要白光）——
   峰值亮度压到 1.12+饱和提升（红字保持红），边框/光晕用饱和金，杜绝发白 */
.rubCard.tour{animation:rubTour 1s ease-in-out;}
@keyframes rubTour{
  0%,100%{border-color:rgba(201,162,39,.35);box-shadow:none;filter:brightness(1);}
  50%{border-color:#f0b93c;box-shadow:0 0 0 3px rgba(216,164,42,.55),0 0 30px rgba(216,164,42,.75);filter:brightness(1.12) saturate(1.25);}
}
/* 巡游收束（增量㉘）：最后一张闪完，整页+所有金边框同闪一次高强度动态金光 1s（效仿铸鼎 dingFlash 双阴影脉冲） */
#s9.wallFinale{animation:wallFinale 1s ease-in-out;}
#s9.wallFinale .rubCard:not(.empty){animation:wallFinaleCard 1s ease-in-out;}
@keyframes wallFinale{
  0%,100%{filter:brightness(1);}
  25%,65%{filter:brightness(2) drop-shadow(0 0 30px rgba(232,201,106,.85)) drop-shadow(0 0 80px rgba(255,214,90,.45));}
  45%{filter:brightness(1.25) drop-shadow(0 0 12px rgba(232,201,106,.4));}
}
@keyframes wallFinaleCard{
  0%,100%{border-color:rgba(201,162,39,.35);box-shadow:none;}
  25%,65%{border-color:#ffd76a;box-shadow:0 0 0 3px rgba(232,201,106,.6),0 0 34px rgba(232,201,106,.8);}
  45%{border-color:rgba(201,162,39,.5);box-shadow:none;}
}
.rubCard .sw{font-size:10.5px;color:#9d9078;margin-top:2px;min-height:26px;}
table.rk{width:100%;border-collapse:collapse;background:var(--paper);color:var(--ink);
  border-radius:14px;overflow:hidden;}
table.rk th,table.rk td{padding:9px 10px;font-size:13px;border-bottom:1px solid var(--paper3);text-align:center;}

/* 结算页内嵌榜单（2026-10-06：通关即见榜，免切拓片墙；紧凑字号保首屏免滚动） */

.taoItem.picked{border-color:var(--patina);background:#e9f5ef;box-shadow:0 4px 14px rgba(63,125,92,.18);}
.taoItem input{width:20px;height:20px;accent-color:var(--patina);flex:none;}
.taoItem .taoIco{font-size:30px;flex:none;}
.taoItem .taoBody{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;}
.taoName{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:20px;font-weight:800;color:var(--ink);}
.taoSkill{font-style:normal;font-size:11px;color:var(--patina-deep);border:1px solid var(--patina);
  border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px;}
.taoDesc{font-size:13px;color:var(--muted);line-height:1.6;}
.taoBtns{display:flex;gap:12px;justify-content:center;margin-top:14px;}
/* 点兵点将 */
.dianRules{max-width:640px;margin:0 auto 16px;text-align:left;font-size:14px;line-height:1.9;color:var(--ink);}
.dianRules b{color:var(--cin-deep);}
.tierDesc{width:100%;font-size:13px;color:var(--patina-deep);font-weight:700;margin-top:6px;}
.dianBar{width:min(100%,240px);margin:2px auto 0;}
.dianBarNum{font-size:14px;font-weight:800;color:var(--gold-hi);min-height:18px;font-variant-numeric:tabular-nums;text-align:center;}
.dianVsRow{margin-top:10px;flex-wrap:wrap;}
.dianStage{max-width:980px;margin:0 auto;}
.dianBanner{font-size:14px;font-weight:800;color:var(--gold-hi);letter-spacing:1px;text-align:center;margin-bottom:8px;}
.dianMain{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;flex:1 1 auto;}
.dianHalfName{font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-size:18px;font-weight:800;color:var(--gold-hi);letter-spacing:2px;line-height:1.2;}
.dianScoreTag{font-size:12.5px;color:#cbbd9d;}
.dianScoreTag b{color:var(--gold-hi);font-size:16px;}
.dianGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.dcell{position:relative;width:clamp(76px,10.5vw,118px);height:clamp(76px,10.5vw,118px);border-radius:16px;
  border:2.5px dashed rgba(201,162,39,.45);background:rgba(241,232,214,.07);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;user-select:none;}
.dcell svg{width:78%;height:78%;display:block;pointer-events:none;}
.dcell svg path{fill:#f1e8d6 !important;}   /* 深底上反白显示（拓片感，沿用 rubCard 的 fill 覆盖法） */
.dcell.lit{border-style:solid;border-color:var(--gold);background:rgba(241,232,214,.12);animation:dPop .4s;}
.dcell.gone{border-style:solid;border-color:rgba(201,162,39,.2);transition:.4s;}
.dcell.stamped{border-style:solid;border-color:var(--gold-hi);}
.dcell.right{border-color:var(--ok);background:rgba(29,158,117,.16);}
.dcell.wrong{border-color:var(--cin);background:rgba(176,58,46,.16);}
.dcell.dim{opacity:.55;}
@keyframes dPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.dstamp{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;
  background:var(--cin);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.4);animation:dPop .25s;z-index:2;}
.dSide{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:118px;flex:none;}
.dianOk{min-width:96px;}
.dianCount{font-size:13px;color:#cbbd9d;letter-spacing:1px;}
.dianCount b{color:var(--gold-hi);font-size:16px;}
.dianFeed{font-size:14px;font-weight:800;min-height:22px;text-align:center;}
.dianFeed.good{color:var(--ok);} .dianFeed.bad{color:#ff8f83;} .dianFeed.mid{color:var(--gold-hi);}
.dianMemHint{font-size:13px;color:#cbbd9d;text-align:center;min-height:20px;letter-spacing:1px;}
.dianMemHint b{color:var(--gold-hi);}
/* 双人分屏：确认键分立中缝两侧、垂直居中（何何老师 2026-10-07 定稿位置：答题区相邻处，
   不在屏幕底部）—— R 半屏确认键在答题区左缘，两键环抱中缝，像两位将军各自举令旗 */
.dianPk{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;margin-top:6px;}
.dianDivider{align-self:stretch;background:linear-gradient(180deg,transparent,rgba(201,162,39,.5),transparent);
  border-left:1px dashed rgba(201,162,39,.4);border-right:1px dashed rgba(201,162,39,.4);}
.dianHalf{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0;position:relative;}
/* V3.2 倒计时特效层：消失瞬间在各自半屏内居中（分屏互不遮掩），火焰大字依次更替 */
.dianCdn{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.dianCdnNum{position:absolute;font-family:"STKaiti","Kaiti SC",KaiTi,serif;font-weight:900;
  font-size:clamp(80px,13vw,170px);letter-spacing:6px;white-space:nowrap;
  background:linear-gradient(180deg,#fff3cd 8%,#ffd76a 32%,#ff9f2e 58%,#e0512e 86%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:dCdn .92s cubic-bezier(.2,.8,.3,1) forwards;}
/* 火焰燃烧感：0% 瞬间放大 3 倍（强光）→ 18% 定格 3 倍 → 55% 缩回原大（辉光燃烧起伏）→ 淡出消失 */
@keyframes dCdn{
  0%{transform:scale(3);opacity:0;
    filter:drop-shadow(0 0 26px rgba(255,150,40,.95)) drop-shadow(0 0 60px rgba(255,80,20,.6)) brightness(2.1);}
  18%{transform:scale(3);opacity:1;
    filter:drop-shadow(0 0 24px rgba(255,150,40,.95)) drop-shadow(0 0 56px rgba(255,80,20,.55)) brightness(1.9);}
  55%{transform:scale(1);opacity:1;
    filter:drop-shadow(0 0 18px rgba(255,140,40,.85)) drop-shadow(0 0 46px rgba(255,80,20,.5)) brightness(1.5);}
  72%{filter:drop-shadow(0 0 24px rgba(255,160,50,.95)) drop-shadow(0 0 58px rgba(255,90,25,.6)) brightness(1.8);}
  100%{transform:scale(.88);opacity:0;
    filter:drop-shadow(0 0 12px rgba(255,120,30,.6)) drop-shadow(0 0 30px rgba(255,70,15,.35)) brightness(1.1);}
}
/* New Winner（V3.2）：结算页一次性播报 —— 同款火焰大字（节奏放慢撑满 3 秒）+ 全屏玫瑰花瓣 */
#nwFx{position:fixed;inset:0;z-index:44;display:flex;align-items:center;justify-content:center;pointer-events:none;}
#nwFx .nwText{position:absolute;font-size:clamp(56px,9vw,120px);letter-spacing:4px;
  animation:nwText 2.6s cubic-bezier(.2,.8,.3,1) forwards;}
@keyframes nwText{
  0%{transform:scale(3);opacity:0;filter:drop-shadow(0 0 30px rgba(255,150,40,.95)) brightness(2.1);}
  14%{transform:scale(3);opacity:1;filter:drop-shadow(0 0 26px rgba(255,150,40,.95)) brightness(1.9);}
  38%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 18px rgba(255,140,40,.85)) brightness(1.5);}
  55%{filter:drop-shadow(0 0 26px rgba(255,160,50,.95)) brightness(1.8);}
  82%{transform:scale(1.02);opacity:1;}
  100%{transform:scale(.94);opacity:0;filter:drop-shadow(0 0 12px rgba(255,120,30,.5)) brightness(1.1);}
}
.nwPetals{position:absolute;inset:0;overflow:hidden;}
.nwPetals i{position:absolute;top:-26px;width:15px;height:13px;
  background:radial-gradient(circle at 32% 30%,#ffb3c1,#e05a6d 58%,#b03a4a);
  border-radius:62% 38% 56% 44%/56% 62% 38% 44%;
  box-shadow:0 1px 4px rgba(176,58,74,.4);
  animation:nwFall linear forwards;}
@keyframes nwFall{0%{margin-top:0;opacity:0}12%{opacity:1}100%{margin-top:108vh;opacity:.55;transform:rotate(300deg)}}
@media (max-width:900px){.dianPk{grid-template-columns:1fr;}.dianDivider{display:none;}
  .dianHalf.R{margin-top:14px;}}
</style>
